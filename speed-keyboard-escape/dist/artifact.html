<title>+1 Speed Keyboard Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3b1f4a;
  --pink: #ff6fa5;
  --pink2: #ff9ec7;
  --gold: #ffd23f;
  --mint: #6df0b0;
  --sky: #6cc4ff;
  --violet: #b57bff;
  --panel: #fff7fc;
  --panel-line: #ffffff;
  --shadow: 0 6px 0 rgba(59, 31, 74, 0.28);
  --font: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #ffd6ec; color: var(--ink);
  font-family: var(--font); font-weight: 600; user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none;
}
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
canvas#c:active { cursor: grabbing; }

/* chữ viền kiểu Roblox */
.stroke { color: #fff; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink); }

#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: none; }
#hud button, #hud .click { pointer-events: auto; }

/* ---- thống kê trái ---- */
#stats {
  position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
  display: flex; flex-direction: column; gap: 8px;
}
.pill {
  display: flex; align-items: center; gap: 10px; min-width: 176px; padding: 6px 16px 6px 8px;
  border-radius: 999px; border: 3px solid #fff; box-shadow: var(--shadow);
  background: linear-gradient(180deg, var(--c1), var(--c2));
}
.pill .ic {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
  background: rgba(255, 255, 255, 0.55); border: 2px solid rgba(255, 255, 255, 0.9);
}
.pill .tx { display: flex; flex-direction: column; line-height: 1; }
.pill .lb { font-size: 11px; letter-spacing: 0.08em; opacity: 0.8; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.pill .v { font-size: 26px; font-weight: 700; margin-top: 2px; }
#pSpeed { --c1: #ff9ec7; --c2: #ff5f9f; }
#pWins { --c1: #ffe27a; --c2: #ffb703; }
#pReb { --c1: #b9a0ff; --c2: #8a5cff; }
#stepInfo {
  font-size: 13px; padding: 4px 12px; border-radius: 12px; background: rgba(59, 31, 74, 0.72); color: #fff; width: fit-content;
}

/* ---- level bar ---- */
#lvl {
  position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%);
  width: min(520px, 46vw); text-align: center;
}
#lvlRow { display: flex; align-items: center; gap: 8px; }
#lvlText { font-size: 22px; min-width: 64px; text-align: left; }
#lvlBarWrap {
  flex: 1; height: 22px; background: rgba(59, 31, 74, 0.55); border: 3px solid #fff; border-radius: 999px; overflow: hidden;
  box-shadow: var(--shadow); position: relative;
}
#lvlBar { height: 100%; width: 0%; background: linear-gradient(90deg, #6df0b0, #ffe27a, #ff6fa5); border-radius: 999px; transition: width 0.15s; }
#lvlNext { font-size: 13px; margin-top: 6px; }
#stageTag {
  display: inline-block; margin-top: 8px; padding: 4px 16px; border-radius: 999px; background: rgba(59, 31, 74, 0.78);
  color: #fff; font-size: 14px; border: 2px solid rgba(255, 255, 255, 0.85);
}
#stageTag b { color: var(--gold); }

/* ---- menu phải ---- */
#menu {
  position: absolute; right: max(12px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 10px;
}
.mbtn {
  width: 78px; padding: 8px 4px 6px; border-radius: 18px; border: 3px solid #fff; box-shadow: var(--shadow);
  background: linear-gradient(180deg, var(--c1), var(--c2)); color: #fff; font-family: var(--font); font-weight: 700; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; position: relative;
  text-shadow: 0 2px 0 rgba(59, 31, 74, 0.5);
}
.mbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(59, 31, 74, 0.28); }
.mbtn .e { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(59,31,74,.35)); }
.mbtn kbd {
  position: absolute; left: -6px; top: -6px; background: #fff; color: var(--ink); border-radius: 8px; padding: 0 6px; font: 700 12px var(--font);
  border: 2px solid var(--ink); text-shadow: none;
}
.mbtn.dot::after {
  content: "!"; position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: #ff3d71; color: #fff;
  display: grid; place-items: center; font-size: 14px; border: 2px solid #fff; animation: pulse 0.9s infinite;
}
@keyframes pulse { 50% { transform: scale(1.2); } }
#bShop { --c1: #ff9ec7; --c2: #ff4f93; }
#bReb { --c1: #c9a6ff; --c2: #8a5cff; }
#bStages { --c1: #7fe0ff; --c2: #2f9bff; }
#bBoard { --c1: #ffe27a; --c2: #f59e0b; }
#bSet { --c1: #b9c4d6; --c2: #7a8aa6; }

/* ---- hint ---- */
#hint {
  position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  font-size: 13px; padding: 6px 14px; border-radius: 999px; background: rgba(59, 31, 74, 0.6); color: #fff; white-space: nowrap;
  opacity: 0.9; transition: opacity 0.6s;
}
body.touch #hint { display: none; }

/* ---- toast / popup ---- */
#toasts { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(560px, 92vw); }
.toast {
  padding: 8px 20px; border-radius: 16px; font-size: 20px; font-weight: 700; border: 3px solid #fff; box-shadow: var(--shadow);
  background: linear-gradient(180deg, var(--c1, #ffe27a), var(--c2, #ffb703)); color: #fff; text-align: center;
  text-shadow: 0 2px 0 rgba(59, 31, 74, 0.5); animation: toastIn 0.3s ease-out, toastOut 0.5s ease-in forwards; animation-delay: 0s, var(--life, 2.4s);
}
.toast.big { font-size: 34px; padding: 12px 28px; }
.toast.bad { --c1: #ff7a8c; --c2: #e0334f; }
.toast.good { --c1: #6df0b0; --c2: #1fb877; }
.toast.info { --c1: #7fd6ff; --c2: #3b8bff; }
.toast.purple { --c1: #c9a6ff; --c2: #8a5cff; }
@keyframes toastIn { from { transform: translateY(-14px) scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(-10px); opacity: 0; } }
#popups { position: absolute; inset: 0; overflow: hidden; }
.pop {
  position: absolute; font-size: 22px; font-weight: 700; color: #fff; white-space: nowrap; will-change: transform, opacity;
  text-shadow: -2px -2px 0 #1f7a3c, 2px -2px 0 #1f7a3c, -2px 2px 0 #1f7a3c, 2px 2px 0 #1f7a3c, 0 3px 0 #1f7a3c;
  animation: popUp 0.85s ease-out forwards; transform: translate(-50%, -50%);
}
.pop.gold { color: #fff3a8; text-shadow: -2px -2px 0 #8a5a00, 2px -2px 0 #8a5a00, -2px 2px 0 #8a5a00, 2px 2px 0 #8a5a00, 0 3px 0 #8a5a00; font-size: 26px; }
@keyframes popUp { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -48px; } }

#banner {
  position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none;
}
#banner.show { animation: banner 2.6s ease-out forwards; }
#banner .s1 { font-size: 20px; letter-spacing: 0.25em; }
#banner .s2 { font-size: clamp(34px, 7vw, 68px); line-height: 1.05; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }

#flash { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0; background: #ff3d71; transition: opacity 0.35s; }
#flash.on { opacity: 0.55; transition: none; }
#fade { position: fixed; inset: 0; pointer-events: none; z-index: 7; opacity: 0; background: #fff; transition: opacity 0.35s; }
#fade.on { opacity: 1; }

/* ---- modal ---- */
#modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(40, 14, 56, 0.45); backdrop-filter: blur(3px); }
#modal.open { display: grid; }
.panel {
  width: min(760px, 94vw); max-height: min(86vh, 720px); display: flex; flex-direction: column; background: var(--panel);
  border: 5px solid #fff; border-radius: 26px; box-shadow: 0 10px 0 rgba(59, 31, 74, 0.35), 0 0 0 4px var(--ink); overflow: hidden;
  animation: panelIn 0.22s ease-out; touch-action: pan-y;
}
@keyframes panelIn { from { transform: scale(0.88); opacity: 0; } to { transform: none; opacity: 1; } }
.ph {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 18px;
  background: linear-gradient(180deg, var(--h1, #ff9ec7), var(--h2, #ff4f93)); color: #fff;
}
.ph h2 { margin: 0; font-size: 28px; }
.ph .x {
  width: 40px; height: 40px; border-radius: 12px; border: 3px solid #fff; background: #ff4f6d; color: #fff; font: 700 22px var(--font);
  cursor: pointer; box-shadow: 0 3px 0 rgba(59, 31, 74, 0.35);
}
.pb { padding: 14px 18px 18px; overflow: auto; -webkit-overflow-scrolling: touch; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  padding: 8px 14px; border-radius: 14px; border: 3px solid #fff; background: #e6d8f0; color: var(--ink); font: 700 15px var(--font);
  cursor: pointer; box-shadow: 0 3px 0 rgba(59, 31, 74, 0.2);
}
.tab.on { background: linear-gradient(180deg, #ffe27a, #ffb703); box-shadow: 0 3px 0 rgba(59, 31, 74, 0.3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  background: #fff; border: 3px solid #f0d6ee; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px; position: relative;
  box-shadow: 0 4px 0 rgba(59, 31, 74, 0.12);
}
.card.eq { border-color: #6df0b0; background: #effff7; }
.card.lock { opacity: 0.65; }
.card h3 { margin: 0; font-size: 17px; }
.card .meta { font-size: 13px; opacity: 0.8; }
.card .sw { height: 26px; border-radius: 10px; border: 2px solid rgba(59,31,74,.15); }
.btn {
  padding: 8px 12px; border-radius: 14px; border: 3px solid #fff; font: 700 16px var(--font); color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #6df0b0, #1fb877); text-shadow: 0 2px 0 rgba(59, 31, 74, 0.45); box-shadow: 0 4px 0 rgba(59, 31, 74, 0.3);
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(59, 31, 74, 0.3); }
.btn.gold { background: linear-gradient(180deg, #ffe27a, #ffb703); }
.btn.pink { background: linear-gradient(180deg, #ff9ec7, #ff4f93); }
.btn.gray { background: linear-gradient(180deg, #c9c2d4, #9b93aa); }
.btn.red { background: linear-gradient(180deg, #ff8a9a, #e0334f); }
.btn[disabled] { filter: grayscale(0.7); opacity: 0.6; cursor: not-allowed; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 2px dashed #ecd9ec; }
.row:last-child { border-bottom: 0; }
.big { font-size: 38px; font-weight: 700; }
.bar { height: 22px; background: #e9dcee; border: 3px solid #fff; border-radius: 999px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(59,31,74,.15); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #6df0b0, #ffe27a, #ff6fa5); border-radius: 999px; }
.note { font-size: 13px; opacity: 0.75; margin: 6px 0; }
table.rb { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rb td, table.rb th { padding: 5px 8px; text-align: center; border-bottom: 1px solid #ecd9ec; }
table.rb tr.cur td { background: #fff3c4; font-weight: 700; }
table.rb tr.done td { opacity: 0.45; }
.stage-card { overflow: hidden; padding: 0; }
.stage-card .top { padding: 8px 12px; color: #fff; text-shadow: 0 2px 0 rgba(59,31,74,.5); font-weight: 700; display: flex; justify-content: space-between; }
.stage-card .bd { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
input[type=range] { width: 100%; accent-color: #ff4f93; }
.radio { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 14px; border: 3px solid #fff; background: #e6d8f0; font: 700 15px var(--font); cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 rgba(59,31,74,.2); }
.chip.on { background: linear-gradient(180deg, #6df0b0, #1fb877); color: #fff; text-shadow: 0 2px 0 rgba(59,31,74,.4); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; }
.keys kbd { background: #fff; border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 8px; padding: 1px 9px; font: 700 14px var(--font); text-align: center; }
.lbrow { display: grid; grid-template-columns: 34px 1fr 100px 90px; gap: 8px; padding: 7px 8px; align-items: center; border-radius: 12px; }
.lbrow.me { background: #fff3c4; font-weight: 700; }
.lbrow.hd { font-size: 12px; opacity: 0.65; text-transform: uppercase; }

/* ---- touch ---- */
#touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; display: none; }
body.touch #touch { display: block; }
#stick {
  position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.28); border: 4px solid rgba(255, 255, 255, 0.75); pointer-events: auto; touch-action: none;
}
#knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: rgba(255, 111, 165, 0.9); border: 3px solid #fff; }
#jumpBtn {
  position: absolute; right: max(26px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); width: 96px; height: 96px; border-radius: 50%;
  background: linear-gradient(180deg, #ffe27a, #ffb703); border: 4px solid #fff; color: #fff; font: 700 20px var(--font); pointer-events: auto; touch-action: none;
  text-shadow: 0 2px 0 rgba(59,31,74,.5); box-shadow: var(--shadow);
}
body.touch #menu { top: 10px; transform: none; gap: 6px; }
body.touch .mbtn { width: 46px; height: 46px; padding: 0; border-radius: 14px; font-size: 0; justify-content: center; }
body.touch .mbtn .e { font-size: 22px; }
body.touch .mbtn kbd { display: none; }
body.touch .mbtn.dot::after { width: 18px; height: 18px; font-size: 12px; right: -5px; top: -5px; }
@media (max-height: 480px) {
  #stats { gap: 5px; }
  .pill { min-width: 118px; padding: 3px 12px 3px 5px; }
  .pill .v { font-size: 18px; }
  .pill .ic { width: 28px; height: 28px; font-size: 15px; }
  #stepInfo { font-size: 11px; padding: 2px 8px; }
  #stick { width: 116px; height: 116px; bottom: 16px; }
  #knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  #jumpBtn { width: 78px; height: 78px; bottom: 22px; font-size: 16px; }
  #toasts { top: 30%; }
  .toast { font-size: 15px; padding: 5px 14px; }
  .toast.big { font-size: 24px; }
  #lvlNext { font-size: 11px; margin-top: 3px; }
  #lvlText { font-size: 15px; }
  #lvlBarWrap { height: 16px; }
  .panel { max-height: 94vh; }
  .ph { padding: 8px 14px; }
  .ph h2 { font-size: 22px; }
  .pb { padding: 10px 14px 14px; }
}

/* ---- loading ---- */
#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: linear-gradient(180deg, #6cc4ff, #ffd6ec); transition: opacity 0.5s; text-align: center; }
#loading.done { opacity: 0; pointer-events: none; }
#loading h1 { font-size: clamp(36px, 8vw, 78px); margin: 0; line-height: 1; }
#loading p { margin: 10px 0 0; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(59,31,74,.5); }
.spin { width: 48px; height: 48px; margin: 22px auto 0; border-radius: 50%; border: 6px solid #fff; border-top-color: var(--pink); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#err { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 99; background: #3b1f4a; color: #ffd6ec; padding: 10px; border-radius: 12px; display: none; font: 13px monospace; white-space: pre-wrap; }

@media (max-width: 760px) {
  #lvl { width: 40vw; }
  #lvlText { font-size: 16px; min-width: 46px; }
  .pill { min-width: 132px; }
  .pill .v { font-size: 20px; }
  .pill .ic { width: 30px; height: 30px; font-size: 17px; }
  #stageTag { font-size: 12px; }
}

</style>
<canvas id="c" tabindex="0"></canvas>

<div id="hud">
  <div id="stats">
    <div class="pill" id="pSpeed"><div class="ic">⚡</div><div class="tx"><span class="lb">Speed</span><span class="v stroke" id="vSpeed">0</span></div></div>
    <div class="pill" id="pWins"><div class="ic">🏆</div><div class="tx"><span class="lb">Wins</span><span class="v stroke" id="vWins">0</span></div></div>
    <div class="pill" id="pReb"><div class="ic">🔄</div><div class="tx"><span class="lb">Rebirths</span><span class="v stroke" id="vReb">0</span></div></div>
    <div id="stepInfo">+1 / step</div>
  </div>

  <div id="lvl">
    <div id="lvlRow">
      <div id="lvlText" class="stroke">Lv 1</div>
      <div id="lvlBarWrap"><div id="lvlBar"></div></div>
    </div>
    <div id="lvlNext" class="stroke"></div>
    <div id="stageTag"></div>

  <div id="menu">
    <button class="mbtn click" id="bShop"><kbd>B</kbd><span class="e">🛒</span>Shop</button>
    <button class="mbtn click" id="bReb"><kbd>R</kbd><span class="e">🔄</span>Rebirth</button>
    <button class="mbtn click" id="bStages"><kbd>T</kbd><span class="e">🏁</span>Stages</button>
    <button class="mbtn click" id="bBoard"><kbd>Tab</kbd><span class="e">📋</span>Top</button>
    <button class="mbtn click" id="bSet"><kbd>Esc</kbd><span class="e">⚙️</span>Cài đặt</button>
  </div>

  <div id="toasts"></div>
  <div id="popups"></div>
  <div id="banner"><div class="s1 stroke" id="bn1"></div><div class="s2 stroke" id="bn2"></div></div>

</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="jumpBtn">JUMP</button>
</div>

<div id="flash"></div>
<div id="fade"></div>
<div id="modal"></div>

<div id="loading">
  <div>
    <h1 class="stroke">+1 Speed<br>Keyboard Escape</h1>
    <p>Đang dựng bàn phím kẹo khổng lồ…</p>
    <div class="spin"></div>
  </div>
</div>
<div id="err"></div>

<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += (e.message || e.error) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
  });
</script>

<script>
/* Tiện ích dùng chung: toán, RNG, định dạng số, lưu trữ, DOM, texture chữ */
(function () {
  'use strict';
  const SKE = (window.SKE = window.SKE || {});
  const U = (SKE.util = {});

  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.damp = (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt));
  U.approach = (v, target, delta) => (v < target ? Math.min(v + delta, target) : Math.max(v - delta, target));
  U.angleDiff = (a, b) => {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  };

  // mulberry32
  U.rng = (seed) => {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  U.fmt = (n) => {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + U.fmt(-n);
    if (n < 1000) {
      if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
      return (Math.round(n * 10) / 10).toString();
    }
    const tier = Math.floor(Math.log10(n) / 3);
    if (tier >= SUF.length) return n.toExponential(2).replace('+', '');
    const v = n / Math.pow(10, tier * 3);
    const dec = v < 10 ? 2 : v < 100 ? 1 : 0;
    return parseFloat(v.toFixed(dec)).toString() + SUF[tier];
  };
  U.fmtInt = (n) => U.fmt(Math.floor(n));
  U.fmtMult = (m) => '×' + U.fmt(m);

  U.load = (key, fallback) => {
    try {
      const s = window.localStorage.getItem(key);
      return s ? JSON.parse(s) : fallback;
    } catch (e) {
      return fallback;
    }
  };
  U.save = (key, value) => {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  };

  U.$ = (sel, root) => (root || document).querySelector(sel);
  U.el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };

  U.hex = (h) => new window.THREE.Color(h);

  /** Canvas texture chữ (dùng cho sprite biển hiệu) */
  U.textTexture = (text, o) => {
    o = o || {};
    const w = o.w || 512;
    const h = o.h || 128;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    const lines = Array.isArray(text) ? text : [text];
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.lineJoin = 'round';
    const lh = h / lines.length;
    lines.forEach((ln, i) => {
      const sizeBase = (o.sizes && o.sizes[i]) || lh * 0.72;
      let size = sizeBase;
      g.font = `800 ${size}px ${SKE.FONT}`;
      const maxW = w * 0.94;
      const m = g.measureText(ln).width;
      if (m > maxW) size = size * (maxW / m);
      g.font = `800 ${size}px ${SKE.FONT}`;
      const y = lh * (i + 0.5);
      g.lineWidth = o.stroke != null ? o.stroke : size * 0.2;
      g.strokeStyle = (o.strokeColors && o.strokeColors[i]) || o.strokeColor || '#3b1f4a';
      g.strokeText(ln, w / 2, y);
      g.fillStyle = (o.fills && o.fills[i]) || o.fill || '#ffffff';
      g.fillText(ln, w / 2, y);
    });
    const tex = new window.THREE.CanvasTexture(c);
    tex.colorSpace = window.THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    tex.userData = { canvas: c };
    return tex;
  };

  SKE.FONT = '"Fredoka","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
})();

<script>
/* Âm thanh tổng hợp bằng WebAudio (không cần file mp3) — ASMR click + SFX */
(function () {
  'use strict';
  const SKE = (window.SKE = window.SKE || {});

  let ctx = null;
  let master = null;
  let noiseBuf = null;
  let volume = 0.7;
  let pack = 'keyboard';
  let lastStep = 0;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = volume;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 6;
      master.connect(comp);
      comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) {
      ctx = null;
    }
  }

  function resume() {
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function tone(freq, type, attack, decay, peak, freqEnd, delay) {
    if (!ctx) return;
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + attack + decay);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + attack + decay + 0.05);
  }

  function noise(attack, decay, peak, ftype, ffreq, q, delay) {
    if (!ctx) return;
    const t = ctx.currentTime + (delay || 0);
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = ftype;
    f.frequency.value = ffreq;
    f.Q.value = q || 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    s.connect(f);
    f.connect(g);
    g.connect(master);
    s.start(t, Math.random() * 0.5);
    s.stop(t + attack + decay + 0.05);
  }

  const A = (SKE.audio = {
    init,
    resume,
    get ready() { return !!ctx; },
    setVolume(v) {
      volume = v;
      if (master) master.gain.value = v;
    },
    setPack(p) { pack = p; },

    /** Tiếng bước chân (mỗi step) */
    step(pitch) {
      if (!ctx) return;
      const now = ctx.currentTime;
      if (now - lastStep < 0.04) return;
      lastStep = now;
      const p = pitch || 1;
      switch (pack) {
        case 'chocolate':
          tone(210 * p, 'sine', 0.003, 0.11, 0.55, 90 * p);
          noise(0.003, 0.07, 0.2, 'lowpass', 700);
          break;
        case 'water':
          tone(420 * p, 'sine', 0.006, 0.13, 0.38, 900 * p);
          tone(840 * p, 'sine', 0.006, 0.08, 0.1, 1500 * p);
          break;
        case 'bubbles':
          tone(700 * p, 'sine', 0.002, 0.06, 0.32, 1700 * p);
          tone(1250 * p, 'sine', 0.002, 0.04, 0.1, 2200 * p, 0.015);
          break;
        case 'lava':
          noise(0.01, 0.15, 0.45, 'lowpass', 380);
          tone(95 * p, 'sawtooth', 0.01, 0.15, 0.16, 55 * p);
          break;
        default: // keyboard — thock + click
          noise(0.001, 0.022, 0.5, 'highpass', 2600, 0.7);
          tone(560 * p, 'square', 0.001, 0.04, 0.13, 300 * p);
          tone(2300 * p, 'sine', 0.001, 0.018, 0.1);
          tone(150 * p, 'sine', 0.002, 0.07, 0.35, 90 * p);
      }
    },
    jump() { tone(300, 'sine', 0.005, 0.12, 0.22, 640); },
    land() { noise(0.002, 0.06, 0.25, 'lowpass', 500); tone(120, 'sine', 0.002, 0.08, 0.3, 70); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 'triangle', 0.005, 0.28, 0.32, 0, i * 0.075)); },
    buy() { tone(880, 'square', 0.002, 0.07, 0.16); tone(1320, 'square', 0.002, 0.12, 0.16, 0, 0.07); },
    deny() { tone(190, 'sawtooth', 0.003, 0.14, 0.2, 140); },
    click() { tone(1000, 'sine', 0.002, 0.04, 0.12); },
    levelUp() { [660, 880, 1100].forEach((f, i) => tone(f, 'sine', 0.004, 0.16, 0.25, 0, i * 0.06)); },
    rebirth() {
      tone(200, 'sawtooth', 0.02, 0.9, 0.2, 1600);
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 'triangle', 0.01, 0.6, 0.28, 0, 0.5 + i * 0.09));
    },
    die() { tone(520, 'square', 0.004, 0.32, 0.2, 90); noise(0.003, 0.12, 0.25, 'lowpass', 900); },
    splash() { noise(0.004, 0.28, 0.4, 'lowpass', 1400); tone(240, 'sine', 0.004, 0.2, 0.25, 90); },
    warn() { tone(1500, 'square', 0.002, 0.08, 0.1); },
    laser() { noise(0.002, 0.25, 0.4, 'bandpass', 3000, 2); tone(1800, 'sawtooth', 0.002, 0.25, 0.2, 200); },
    checkpoint() { tone(740, 'triangle', 0.004, 0.14, 0.22); tone(988, 'triangle', 0.004, 0.2, 0.22, 0, 0.08); },
    vanish() { tone(340, 'triangle', 0.003, 0.12, 0.12, 160); },
  });
})();

<script>
/* Thực thể động: sàn di động, cầu biến mất, thanh quay, brainrot, laser */
(function () {
  'use strict';
  const SKE = window.SKE;
  const THREE = window.THREE;
  const U = SKE.util;
  const E = (SKE.entities = {});

  const mat = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0.0 }, o || {}));

  // ------------------------------------------------------------------ Mover
  E.Mover = class {
    constructor(mesh, box, a, b, period, phase) {
      this.mesh = mesh;
      this.box = box;
      this.a = a;
      this.b = b;
      this.period = period;
      this.phase = phase || 0;
      this.hx = (box.x1 - box.x0) / 2;
      this.hz = (box.z1 - box.z0) / 2;
      this.cx = (a.x + b.x) / 2;
      this.cz = (a.z + b.z) / 2;
      this.update(0, 0);
    }
    update(dt, t) {
      const s = 0.5 - 0.5 * Math.cos((t / this.period + this.phase) * Math.PI * 2);
      const nx = this.a.x + (this.b.x - this.a.x) * s;
      const nz = this.a.z + (this.b.z - this.a.z) * s;
      this.box.dx = nx - this.cx;
      this.box.dz = nz - this.cz;
      this.cx = nx;
      this.cz = nz;
      this.box.x0 = nx - this.hx;
      this.box.x1 = nx + this.hx;
      this.box.z0 = nz - this.hz;
      this.box.z1 = nz + this.hz;
      this.mesh.position.x = nx;
      this.mesh.position.z = nz;
    }
  };

  // --------------------------------------------------------------- Vanisher
  E.Vanisher = class {
    constructor(mesh, box, audio) {
      this.mesh = mesh;
      this.box = box;
      this.audio = audio;
      this.state = 'idle';
      this.timer = 0;
      this.vy = 0;
      this.baseX = mesh.position.x;
      this.baseY = mesh.position.y;
      this.baseZ = mesh.position.z;
      this.delay = 0.7;
    }
    touch() {
      if (this.state === 'idle') {
        this.state = 'shake';
        this.timer = 0;
        this.audio.vanish();
      }
    }
    update(dt) {
      const m = this.mesh;
      this.timer += dt;
      switch (this.state) {
        case 'shake':
          m.position.x = this.baseX + (Math.random() - 0.5) * 0.18;
          m.position.z = this.baseZ + (Math.random() - 0.5) * 0.18;
          if (this.timer > this.delay) {
            this.state = 'fall';
            this.timer = 0;
            this.vy = 0;
            this.box.active = false;
            m.position.x = this.baseX;
            m.position.z = this.baseZ;
          }
          break;
        case 'fall':
          this.vy += 40 * dt;
          m.position.y -= this.vy * dt;
          m.scale.setScalar(Math.max(0.01, 1 - this.timer * 0.8));
          if (this.timer > 1.1) {
            this.state = 'hidden';
            this.timer = 0;
            m.visible = false;
          }
          break;
        case 'hidden':
          if (this.timer > 2.4) {
            this.state = 'return';
            this.timer = 0;
            m.visible = true;
            m.position.y = this.baseY;
            m.scale.setScalar(0.01);
          }
          break;
        case 'return': {
          const k = Math.min(1, this.timer / 0.25);
          m.scale.setScalar(Math.max(0.01, k));
          if (k >= 1) {
            this.state = 'idle';
            this.box.active = true;
            m.scale.setScalar(1);
          }
          break;
        }
        default:
      }
    }
  };

  // ---------------------------------------------------------------- Spinner
  E.Spinner = class {
    constructor(scene, x, y, z, halfLen, speed, color) {
      this.x = x;
      this.y = y;
      this.z = z;
      this.L = halfLen;
      this.speed = speed;
      this.ang = Math.random() * Math.PI * 2;
      const g = (this.group = new THREE.Group());
      g.position.set(x, y, z);
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 1.0, 16), mat('#ffffff'));
      pillar.position.y = 0.5;
      pillar.castShadow = true;
      g.add(pillar);
      this.bar = new THREE.Group();
      // thanh sọc kẹo
      const segs = 7;
      const len = (halfLen * 2) / segs;
      for (let i = 0; i < segs; i++) {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, len, 12), mat(i % 2 ? '#ffffff' : color));
        m.rotation.z = Math.PI / 2;
        m.position.set(-halfLen + len * (i + 0.5), 0.8, 0);
        m.castShadow = true;
        this.bar.add(m);
      }
      [-1, 1].forEach((s) => {
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 10), mat(color));
        ball.position.set(s * halfLen, 0.8, 0);
        ball.castShadow = true;
        this.bar.add(ball);
      });
      g.add(this.bar);
      scene.add(g);
    }
    update(dt) {
      this.ang += this.speed * dt;
      this.bar.rotation.y = this.ang;
    }
    hit(p) {
      if (p.y > this.y + 1.45 || p.y + 2.1 < this.y + 0.3) return false;
      const dx = p.x - this.x;
      const dz = p.z - this.z;
      const ux = Math.cos(this.ang);
      const uz = -Math.sin(this.ang);
      const t = U.clamp(dx * ux + dz * uz, -this.L, this.L);
      const px = ux * t - dx;
      const pz = uz * t - dz;
      return px * px + pz * pz < 0.85 * 0.85;
    }
  };

  // -------------------------------------------------------------- Brainrot
  const STYLE_COLORS = ['#ff4fd8', '#39ff88', '#ffb703', '#4dd2ff'];

  function buildBrainrot(style, color) {
    const g = new THREE.Group();
    const body = mat(color, { roughness: 0.4, emissive: color, emissiveIntensity: 0.15 });
    const white = mat('#ffffff', { roughness: 0.2 });
    const black = mat('#15121c', { roughness: 0.3 });
    const parts = { legs: [], arms: [] };
    let eyeY = 1.9;
    let eyeZ = 0.7;
    let eyeX = 0.42;
    if (style === 0) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(1.15, 20, 14), body);
      b.scale.set(1, 1.08, 1);
      b.position.y = 1.35;
      g.add(b);
      parts.body = b;
      eyeY = 1.9;
      eyeZ = 0.95;
    } else if (style === 1) {
      const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 1.5, 6, 14), body);
      b.position.y = 1.7;
      g.add(b);
      parts.body = b;
      const hat = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.9, 12), mat('#ff3d71'));
      hat.position.y = 3.15;
      g.add(hat);
      eyeY = 2.3;
      eyeZ = 0.62;
    } else {
      const b = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.7, 1.8), body);
      b.position.y = 1.35;
      g.add(b);
      parts.body = b;
      [-0.55, 0.55].forEach((x) => {
        const st = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7, 6), black);
        st.position.set(x, 2.45, 0.3);
        g.add(st);
      });
      eyeY = 2.85;
      eyeZ = 0.3;
      eyeX = 0.55;
    }
    // mắt
    parts.pupils = [];
    [-1, 1].forEach((s) => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.4, 14, 12), white);
      eye.position.set(s * eyeX, eyeY, eyeZ);
      g.add(eye);
      const pu = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), black);
      pu.position.set(s * eyeX, eyeY, eyeZ + 0.3);
      g.add(pu);
      parts.pupils.push(pu);
    });
    // miệng + răng
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.28, 0.2), black);
    mouth.position.set(0, eyeY - 0.75, eyeZ + (style === 0 ? 0.05 : 0.15));
    g.add(mouth);
    for (let i = -1; i <= 1; i += 2) {
      const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.12), white);
      tooth.position.set(i * 0.25, eyeY - 0.62, eyeZ + (style === 0 ? 0.13 : 0.23));
      g.add(tooth);
    }
    // chân
    [-0.5, 0.5].forEach((x) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.55, 8), black);
      leg.position.set(x, 0.3, 0);
      g.add(leg);
      parts.legs.push(leg);
    });
    // tay
    if (style !== 0) {
      [-1, 1].forEach((s) => {
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.0, 6), body);
        arm.position.set(s * (style === 1 ? 1.05 : 1.25), 1.4, 0);
        arm.rotation.z = s * 0.6;
        g.add(arm);
        parts.arms.push(arm);
      });
    }
    g.traverse((o) => {
      if (o.isMesh) o.castShadow = true;
    });
    g.userData = parts;
    return g;
  }

  E.Brainrot = class {
    /**
     * base: tâm đường tuần tra, axis: hướng tuần tra (đơn vị), half: nửa độ dài tuần tra,
     * perpMax: biên theo trục vuông góc (khi đuổi theo)
     */
    constructor(scene, base, axis, half, perpMax, speed, style, chase, seed) {
      this.base = base; // {x,y,z}
      this.axis = axis; // {x,z}
      this.perp = { x: -axis.z, z: axis.x };
      this.half = half;
      this.perpMax = perpMax;
      this.speed = speed;
      this.chase = chase;
      this.chaseR = 13;
      this.s = (seed % 1) * half * 1.6 - half * 0.8;
      this.o = 0;
      this.dir = seed > 0.5 ? 1 : -1;
      this.t = seed * 10;
      this.model = buildBrainrot(style % 3, STYLE_COLORS[(style + ((seed * 4) | 0)) % STYLE_COLORS.length]);
      this.y = base.y;
      this.x = base.x;
      this.z = base.z;
      this.model.position.set(base.x, base.y, base.z);
      this.yaw = 0;
      this.mode = 'patrol';
      scene.add(this.model);
      this.apply();
    }
    apply() {
      this.x = this.base.x + this.axis.x * this.s + this.perp.x * this.o;
      this.z = this.base.z + this.axis.z * this.s + this.perp.z * this.o;
      this.model.position.set(this.x, this.y + Math.abs(Math.sin(this.t * 7)) * 0.25, this.z);
    }
    update(dt, t, ctx) {
      this.t += dt;
      const p = ctx.player.pos;
      const dx = p.x - this.x;
      const dz = p.z - this.z;
      const dist = Math.hypot(dx, dz);
      const prevS = this.s;
      const prevO = this.o;
      const near = this.chase && dist < this.chaseR && Math.abs(p.y - this.y) < 3.5 && !ctx.player.invuln;
      if (near) {
        this.mode = 'chase';
        const ps = (p.x - this.base.x) * this.axis.x + (p.z - this.base.z) * this.axis.z;
        const po = (p.x - this.base.x) * this.perp.x + (p.z - this.base.z) * this.perp.z;
        const sp = this.speed * 1.2 * dt;
        this.s = U.clamp(U.approach(this.s, U.clamp(ps, -this.half, this.half), sp), -this.half, this.half);
        this.o = U.clamp(U.approach(this.o, U.clamp(po, -this.perpMax, this.perpMax), sp), -this.perpMax, this.perpMax);
      } else {
        this.mode = 'patrol';
        this.s += this.dir * this.speed * dt;
        if (this.s > this.half) { this.s = this.half; this.dir = -1; }
        if (this.s < -this.half) { this.s = -this.half; this.dir = 1; }
        this.o = U.approach(this.o, 0, this.speed * 0.6 * dt);
      }
      const mx = (this.s - prevS) * this.axis.x + (this.o - prevO) * this.perp.x;
      const mz = (this.s - prevS) * this.axis.z + (this.o - prevO) * this.perp.z;
      if (mx * mx + mz * mz > 1e-8) {
        const target = Math.atan2(mx, mz);
        this.yaw += U.angleDiff(this.yaw, target) * Math.min(1, dt * 10);
      }
      this.model.rotation.y = this.yaw;
      this.apply();
      // animation
      const ud = this.model.userData;
      const sw = Math.sin(this.t * 14) * 0.5;
      ud.legs.forEach((l, i) => { l.position.z = (i ? 1 : -1) * sw * 0.5; });
      ud.arms.forEach((a, i) => { a.rotation.x = (i ? 1 : -1) * sw * 1.2; });
      if (ud.body) ud.body.scale.y = (ud.body.userData.sy || (ud.body.userData.sy = ud.body.scale.y)) * (1 + Math.sin(this.t * 9) * 0.04);
    }
    hit(p) {
      const dx = p.x - this.x;
      const dz = p.z - this.z;
      if (dx * dx + dz * dz > 1.35 * 1.35) return false;
      return p.y < this.y + 2.55 && p.y + 2.0 > this.y;
    }
  };

  // ------------------------------------------------------------------ Laser
  function segHitsBox(ax, ay, az, bx, by, bz, b) {
    // slab method
    let t0 = 0;
    let t1 = 1;
    const d = [bx - ax, by - ay, bz - az];
    const o = [ax, ay, az];
    const mn = [b.x0, b.y0, b.z0];
    const mx = [b.x1, b.y1, b.z1];
    for (let i = 0; i < 3; i++) {
      if (Math.abs(d[i]) < 1e-9) {
        if (o[i] < mn[i] || o[i] > mx[i]) return false;
      } else {
        let ta = (mn[i] - o[i]) / d[i];
        let tb = (mx[i] - o[i]) / d[i];
        if (ta > tb) { const tmp = ta; ta = tb; tb = tmp; }
        t0 = Math.max(t0, ta);
        t1 = Math.min(t1, tb);
        if (t0 > t1) return false;
      }
    }
    return true;
  }
  E.segHitsBox = segHitsBox;

  E.Laser = class {
    constructor(scene, pos, baseYaw, sweepAmp, sweepSpeed, range, covers, phase) {
      this.pos = pos; // vị trí chân trụ
      this.baseYaw = baseYaw;
      this.amp = sweepAmp;
      this.spd = sweepSpeed;
      this.range = range;
      this.covers = covers;
      this.phase = phase || 0;
      this.cone = 0.5;
      this.eyeH = 6.5;
      this.lock = 0;
      this.state = 'scan';
      this.stateT = 0;
      this.yaw = baseYaw;
      this.warned = 0;

      const g = (this.group = new THREE.Group());
      g.position.set(pos.x, pos.y, pos.z);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, this.eyeH, 12), mat('#2b2140'));
      pole.position.y = this.eyeH / 2;
      pole.castShadow = true;
      g.add(pole);
      this.head = new THREE.Group();
      this.head.position.y = this.eyeH;
      const shell = new THREE.Mesh(new THREE.SphereGeometry(1.5, 20, 14), mat('#3a2a5c', { roughness: 0.3 }));
      shell.castShadow = true;
      this.head.add(shell);
      this.eyeMat = new THREE.MeshStandardMaterial({ color: '#ff2b2b', emissive: '#ff0000', emissiveIntensity: 0.6 });
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.75, 14, 10), this.eyeMat);
      eye.position.set(0, 0, 1.0);
      this.head.add(eye);
      g.add(this.head);

      // hình quạt dò quét trên mặt sàn
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      const n = 18;
      for (let i = 0; i <= n; i++) {
        const a = -this.cone + (2 * this.cone * i) / n;
        shape.lineTo(Math.sin(a) * range, Math.cos(a) * range);
      }
      shape.lineTo(0, 0);
      const wedgeGeo = new THREE.ShapeGeometry(shape);
      wedgeGeo.rotateX(-Math.PI / 2); // shape (x, y) -> (x, 0, -y) ; ta cần hướng +z => lật lại
      wedgeGeo.scale(1, 1, -1);
      this.wedgeMat = new THREE.MeshBasicMaterial({ color: '#ff3b3b', transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide });
      this.wedge = new THREE.Mesh(wedgeGeo, this.wedgeMat);
      this.wedge.position.set(0, 0.05, 0);
      g.add(this.wedge);

      // tia
      this.beamMat = new THREE.MeshBasicMaterial({ color: '#ff3030', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      this.beam = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10, 1, true), this.beamMat);
      this.beam.visible = false;
      scene.add(this.beam);
      scene.add(g);
    }
    eyePos() { return { x: this.pos.x, y: this.pos.y + this.eyeH, z: this.pos.z }; }
    blocked(ex, ey, ez, px, py, pz) {
      for (let i = 0; i < this.covers.length; i++) {
        if (segHitsBox(ex, ey, ez, px, py, pz, this.covers[i])) return true;
      }
      return false;
    }
    setBeam(ex, ey, ez, px, py, pz, radius, opacity) {
      const dx = px - ex;
      const dy = py - ey;
      const dz = pz - ez;
      const len = Math.hypot(dx, dy, dz);
      this.beam.visible = opacity > 0.01;
      this.beamMat.opacity = opacity;
      this.beam.position.set((ex + px) / 2, (ey + py) / 2, (ez + pz) / 2);
      this.beam.scale.set(radius, len, radius);
      this.beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx / len, dy / len, dz / len));
    }
    update(dt, t, ctx) {
      const p = ctx.player.pos;
      const e = this.eyePos();
      const chestY = p.y + 1.1;
      this.stateT += dt;
      const sweep = this.baseYaw + this.amp * Math.sin(t * this.spd + this.phase);
      const dx = p.x - e.x;
      const dz = p.z - e.z;
      const dist = Math.hypot(dx, dz);
      const angTo = Math.atan2(dx, dz);
      const inCone = Math.abs(U.angleDiff(sweep, angTo)) < this.cone && dist < this.range;
      const visible = inCone && !ctx.player.invuln && !this.blocked(e.x, e.y, e.z, p.x, chestY, p.z);

      if (this.state === 'scan') {
        this.yaw += U.angleDiff(this.yaw, sweep) * Math.min(1, dt * 8);
        if (visible) {
          this.lock += dt;
          if (this.lock > 0.12 && this.warned < Math.floor(this.lock / 0.25) + 1) {
            this.warned = Math.floor(this.lock / 0.25) + 1;
            ctx.audio.warn();
          }
          this.setBeam(e.x, e.y, e.z, p.x, chestY, p.z, 0.07, Math.min(0.8, this.lock * 0.9));
        } else {
          this.lock = Math.max(0, this.lock - dt * 1.2);
          this.warned = 0;
          this.beam.visible = false;
        }
        if (this.lock >= 0.8) {
          this.state = 'fire';
          this.stateT = 0;
          this.lock = 0;
          this.warned = 0;
          ctx.audio.laser();
          if (visible) ctx.kill('laser');
          this.fireTarget = { x: p.x, y: chestY, z: p.z };
        }
      } else if (this.state === 'fire') {
        const ft = this.fireTarget;
        this.yaw += U.angleDiff(this.yaw, Math.atan2(ft.x - e.x, ft.z - e.z)) * Math.min(1, dt * 20);
        this.setBeam(e.x, e.y, e.z, ft.x, ft.y, ft.z, 0.45 * (1 - this.stateT / 0.35), 0.9);
        if (this.stateT > 0.35) {
          this.state = 'cool';
          this.stateT = 0;
          this.beam.visible = false;
        }
      } else {
        this.beam.visible = false;
        this.yaw += U.angleDiff(this.yaw, sweep) * Math.min(1, dt * 4);
        if (this.stateT > 1.2) { this.state = 'scan'; this.stateT = 0; }
      }
      this.head.rotation.y = this.yaw;
      this.wedge.rotation.y = this.yaw;
      const warn = this.state === 'fire' ? 1 : Math.min(1, this.lock / 0.8);
      this.eyeMat.emissiveIntensity = 0.5 + warn * 2.5;
      this.wedgeMat.opacity = 0.14 + warn * 0.3;
    }
  };
})();
