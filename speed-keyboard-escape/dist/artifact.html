<script>
/* Nhân vật (avatar kiểu Roblox), vật lý va chạm AABB, camera, input */
(function () {
  'use strict';
  const SKE = window.SKE;
  const THREE = window.THREE;
  const U = SKE.util;
  const D = SKE.data;

  // ============================================================ Avatar
  function faceTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#ffd34d';
    g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#1b1b1b';
    g.beginPath(); g.ellipse(42, 54, 8, 13, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(86, 54, 8, 13, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#1b1b1b';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.beginPath(); g.arc(64, 74, 26, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  function shirtTexture() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#3b82f6';
    g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#ffffff';
    g.font = `800 62px ${SKE.FONT}`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('+1', 64, 66);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  class Avatar {
    constructor() {
      const g = (this.group = new THREE.Group());
      const skin = new THREE.MeshStandardMaterial({ color: '#ffd34d', roughness: 0.6 });
      const legMat = new THREE.MeshStandardMaterial({ color: '#2fb36b', roughness: 0.6 });
      const shirtFront = new THREE.MeshStandardMaterial({ map: shirtTexture(), roughness: 0.6 });
      const shirt = new THREE.MeshStandardMaterial({ color: '#3b82f6', roughness: 0.6 });
      const faceMat = new THREE.MeshStandardMaterial({ map: faceTexture(), roughness: 0.6 });
      const box = (w, h, d, m) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
        mesh.castShadow = true;
        return mesh;
      };
      // thân
      this.torso = box(0.95, 0.72, 0.5, [shirt, shirt, shirt, shirt, shirtFront, shirt]);
      this.torso.position.y = 1.16;
      g.add(this.torso);
      // đầu (mặt hướng +z)
      this.head = box(0.62, 0.6, 0.62, [skin, skin, skin, skin, faceMat, skin]);
      this.head.position.y = 1.8;
      g.add(this.head);
      // chân / tay có pivot ở hông/vai
      const limb = (w, h, d, m, x, y) => {
        const pivot = new THREE.Group();
        pivot.position.set(x, y, 0);
        const mesh = box(w, h, d, m);
        mesh.position.y = -h / 2;
        pivot.add(mesh);
        g.add(pivot);
        return pivot;
      };
      this.legL = limb(0.4, 0.8, 0.4, legMat, -0.22, 0.8);
      this.legR = limb(0.4, 0.8, 0.4, legMat, 0.22, 0.8);
      this.armL = limb(0.32, 0.74, 0.32, skin, -0.64, 1.48);
      this.armR = limb(0.32, 0.74, 0.32, skin, 0.64, 1.48);
      this.phase = 0;
      this.swing = 0;
      this.air = 0;
      this.yaw = 0;
      this.squash = 0;
    }
    /** run: 0..1 cường độ chạy; cadence: chu kỳ/giây */
    update(dt, run, cadence, airborne, vy) {
      this.phase += dt * cadence * Math.PI * 2;
      this.swing = U.damp(this.swing, run, 14, dt);
      this.air = U.damp(this.air, airborne ? 1 : 0, 16, dt);
      const s = Math.sin(this.phase) * this.swing * 1.0;
      const a = this.air;
      this.legL.rotation.x = U.lerp(s, 0.5, a);
      this.legR.rotation.x = U.lerp(-s, -0.35, a);
      this.armL.rotation.x = U.lerp(-s, -2.5 + Math.min(0.6, Math.max(-0.6, vy * 0.02)), a);
      this.armR.rotation.x = U.lerp(s, -2.5 + Math.min(0.6, Math.max(-0.6, vy * 0.02)), a);
      const bob = Math.abs(Math.sin(this.phase)) * 0.08 * this.swing * (1 - a);
      this.torso.position.y = 1.16 + bob;
      this.head.position.y = 1.8 + bob;
      this.group.rotation.y = this.yaw;
      this.group.scale.y = 1 - this.squash * 0.18;
      this.squash = U.damp(this.squash, 0, 14, dt);
    }
  }

  // ============================================================ Player
  class Player {
    constructor(world) {
      this.world = world;
      this.pos = new THREE.Vector3();
      this.vel = new THREE.Vector3();
      this.half = 0.4;
      this.h = 2.1;
      this.grounded = false;
      this.ground = null;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.invuln = 0;
      this.avatar = new Avatar();
      this.buf = [];
      this.justLanded = 0;
      this.justJumped = false;
      this.hasInput = false;
      this.stuck = 0;
    }
    place(x, y, z) {
      this.pos.set(x, y, z);
      this.vel.set(0, 0, 0);
      this.grounded = false;
      this.ground = null;
    }
    overlapXZ(b) {
      const h = this.half;
      return this.pos.x + h > b.x0 && this.pos.x - h < b.x1 && this.pos.z + h > b.z0 && this.pos.z - h < b.z1;
    }
    q() {
      const h = this.half + 0.1;
      return this.world.query(this.pos.x - h, this.pos.y - 0.6, this.pos.z - h, this.pos.x + h, this.pos.y + this.h + 0.6, this.pos.z + h, this.buf);
    }
    stepY(dt) {
      const prevY = this.pos.y;
      this.pos.y += this.vel.y * dt;
      const list = this.q();
      const tol = Math.max(0.3, -this.vel.y * dt + 0.1);
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (!this.overlapXZ(b)) continue;
        if (this.pos.y < b.y1 && this.pos.y + this.h > b.y0) {
          if (this.vel.y <= 0 && prevY >= b.y1 - tol) {
            this.pos.y = b.y1;
            this.vel.y = 0;
            this.grounded = true;
            this.ground = b;
          } else if (this.vel.y > 0 && prevY + this.h <= b.y0 + 0.3) {
            this.pos.y = b.y0 - this.h;
            this.vel.y = 0;
          }
        }
      }
    }
    stepAxis(dt, axis) {
      const v = this.vel[axis];
      this.pos[axis] += v * dt;
      const list = this.q();
      const h = this.half;
      const lo = axis === 'x' ? 'x0' : 'z0';
      const hi = axis === 'x' ? 'x1' : 'z1';
      const oth = axis === 'x' ? 'z' : 'x';
      const olo = axis === 'x' ? 'z0' : 'x0';
      const ohi = axis === 'x' ? 'z1' : 'x1';
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (!(this.pos[oth] + h > b[olo] && this.pos[oth] - h < b[ohi])) continue;
        if (!(this.pos[axis] + h > b[lo] && this.pos[axis] - h < b[hi])) continue;
        if (!(this.pos.y < b.y1 - 0.001 && this.pos.y + this.h > b.y0)) continue;
        const rise = b.y1 - this.pos.y;
        if (rise > 0 && rise <= 0.55 && this.vel.y <= 0.01) {
          this.pos.y = b.y1; // bước lên bậc thấp
          this.grounded = true;
          this.ground = b;
          continue;
        }
        if (v > 0) this.pos[axis] = b[lo] - h - 1e-4;
        else if (v < 0) this.pos[axis] = b[hi] + h + 1e-4;
        else {
          const a = this.pos[axis] + h - b[lo];
          const c = b[hi] - (this.pos[axis] - h);
          this.pos[axis] += a < c ? -a : c;
        }
        this.vel[axis] = 0;
      }
    }
    probeGround() {
      const list = this.q();
      let best = null;
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        if (!this.overlapXZ(b)) continue;
        if (b.y1 <= this.pos.y + 0.06 && b.y1 >= this.pos.y - 0.12 && (!best || b.y1 > best.y1)) best = b;
      }
      if (best && this.vel.y <= 0.01) {
        this.grounded = true;
        this.ground = best;
      }
    }

    /**
     * input: {ax, ay} (phải/tiến), jump (bool nhấn), camYaw, moveSpeed
     */
    update(dt, input, moveSpeed, audio) {
      const wasGrounded = this.grounded;
      const fallSpeed = this.vel.y;
      // carry theo sàn di động
      if (this.ground && this.ground.dyn && this.ground.owner && this.ground.dx !== undefined) {
        this.pos.x += this.ground.dx;
        this.pos.z += this.ground.dz;
      }
      const sy = Math.sin(input.camYaw);
      const cy = Math.cos(input.camYaw);
      let dx = input.ax * cy + input.ay * -sy;
      let dz = input.ax * -sy + input.ay * -cy;
      const len = Math.hypot(dx, dz);
      this.hasInput = len > 0.05;
      if (len > 1) { dx /= len; dz /= len; }
      const tx = this.hasInput ? dx * moveSpeed : 0;
      const tz = this.hasInput ? dz * moveSpeed : 0;
      let rate;
      if (this.grounded) rate = this.hasInput ? moveSpeed * 10 : moveSpeed * 8;
      else rate = this.hasInput ? moveSpeed * 2.6 : moveSpeed * 0.25;
      const vx = tx - this.vel.x;
      const vz = tz - this.vel.z;
      const vl = Math.hypot(vx, vz);
      const step = rate * dt;
      if (vl <= step || vl < 1e-6) { this.vel.x = tx; this.vel.z = tz; }
      else { this.vel.x += (vx / vl) * step; this.vel.z += (vz / vl) * step; }
      // nhảy (coyote + buffer)
      this.coyote = this.grounded ? 0.1 : this.coyote - dt;
      this.jumpBuf = input.jump ? 0.12 : this.jumpBuf - dt;
      this.justJumped = false;
      if (this.jumpBuf > 0 && this.coyote > 0) {
        this.vel.y = D.JUMP_V;
        this.coyote = 0;
        this.jumpBuf = 0;
        this.grounded = false;
        this.ground = null;
        this.justJumped = true;
        if (audio) audio.jump();
      }
      this.vel.y = Math.max(-70, this.vel.y - D.GRAVITY * dt);
      this.grounded = false;
      const prevGround = this.ground;
      this.ground = null;
      // di chuyển + va chạm (chia nhỏ để không xuyên khối ở tốc độ cao)
      const sp = Math.hypot(this.vel.x, this.vel.z) + Math.abs(this.vel.y);
      const n = Math.max(1, Math.ceil((sp * dt) / 0.3));
      const h = dt / n;
      for (let i = 0; i < n; i++) {
        this.stepY(h);
        this.stepAxis(h, 'x');
        this.stepAxis(h, 'z');
      }
      this.probeGround();
      if (!this.grounded && prevGround && prevGround.dyn && !prevGround.active) this.ground = null;
      this.justLanded = 0;
      if (this.grounded && !wasGrounded && fallSpeed < -8) {
        this.justLanded = -fallSpeed;
        this.avatar.squash = Math.min(1, -fallSpeed / 40);
        if (audio) audio.land();
      }
      if (this.invuln > 0) this.invuln -= dt;
      this.avatar.group.position.copy(this.pos);
    }
  }

  // ============================================================ Camera
  class CameraRig {
    constructor(camera) {
      this.cam = camera;
      this.yaw = 0;
      this.pitch = 0.42;
      this.dist = 15;
      this.focus = new THREE.Vector3();
      this.fov = 68;
      this.shake = 0;
    }
    snap(target, yaw) {
      this.focus.set(target.x, target.y + 1.7, target.z);
      if (yaw !== undefined) this.yaw = yaw;
    }
    update(dt, target, moveSpeed, speedXZ) {
      const lam = 11 + moveSpeed * 0.25;
      const k = 1 - Math.exp(-lam * dt);
      this.focus.x += (target.x - this.focus.x) * k;
      this.focus.z += (target.z - this.focus.z) * k;
      this.focus.y += (target.y + 1.7 - this.focus.y) * (1 - Math.exp(-7 * dt));
      const cp = Math.cos(this.pitch);
      const d = this.dist;
      this.cam.position.set(
        this.focus.x + Math.sin(this.yaw) * cp * d,
        this.focus.y + Math.sin(this.pitch) * d,
        this.focus.z + Math.cos(this.yaw) * cp * d
      );
      if (this.shake > 0) {
        this.cam.position.x += (Math.random() - 0.5) * this.shake;
        this.cam.position.y += (Math.random() - 0.5) * this.shake;
        this.shake = Math.max(0, this.shake - dt * 2);
      }
      this.cam.lookAt(this.focus);
      const targetFov = 68 + Math.min(22, Math.max(0, speedXZ - 12) * 0.32);
      this.fov = U.damp(this.fov, targetFov, 4, dt);
      if (Math.abs(this.cam.fov - this.fov) > 0.01) {
        this.cam.fov = this.fov;
        this.cam.updateProjectionMatrix();
      }
    }
  }

  // ============================================================ Input
  class Input {
    constructor(canvas) {
      this.keys = new Set();
      this.stick = { x: 0, y: 0 };
      this.jumpQueued = false;
      this.jumpHeld = false;
      this.camYawDelta = 0;
      this.camPitchDelta = 0;
      this.zoom = 0;
      this.sens = 1;
      this.handlers = [];
      this.dragId = null;
      const typing = (e) => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT');
      window.addEventListener('keydown', (e) => {
        if (typing(e)) return;
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
        if (k === ' ') {
          if (!this.jumpHeld) this.jumpQueued = true;
          this.jumpHeld = true;
        }
        if (!e.repeat) this.handlers.forEach((h) => h(k, e));
        this.keys.add(k);
      });
      window.addEventListener('keyup', (e) => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (k === ' ') this.jumpHeld = false;
        this.keys.delete(k);
      });
      window.addEventListener('blur', () => { this.keys.clear(); this.jumpHeld = false; });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      canvas.addEventListener('pointerdown', (e) => {
        if (this.dragId !== null) return;
        this.dragId = e.pointerId;
        this.lastX = e.clientX;
        this.lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerId !== this.dragId) return;
        const dx = e.clientX - this.lastX;
        const dy = e.clientY - this.lastY;
        this.lastX = e.clientX;
        this.lastY = e.clientY;
        this.camYawDelta -= dx * 0.0055 * this.sens;
        this.camPitchDelta += dy * 0.0045 * this.sens;
      });
      const end = (e) => { if (e.pointerId === this.dragId) this.dragId = null; };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('wheel', (e) => { e.preventDefault(); this.zoom += Math.sign(e.deltaY); }, { passive: false });
    }
    onKey(fn) { this.handlers.push(fn); }
    axes() {
      const k = this.keys;
      let ax = (k.has('d') || k.has('ArrowRight') ? 1 : 0) - (k.has('a') || k.has('ArrowLeft') ? 1 : 0);
      let ay = (k.has('w') || k.has('ArrowUp') ? 1 : 0) - (k.has('s') || k.has('ArrowDown') ? 1 : 0);
      ax += this.stick.x;
      ay += this.stick.y;
      return { ax: U.clamp(ax, -1, 1), ay: U.clamp(ay, -1, 1) };
    }
    takeJump() {
      const j = this.jumpQueued;
      this.jumpQueued = false;
      return j;
    }
  }

  SKE.Avatar = Avatar;
  SKE.Player = Player;
  SKE.CameraRig = CameraRig;
  SKE.Input = Input;
})();

</script>
<script>
/* Giao diện: HUD + các bảng (Shop, Rebirth, Stages, Settings, Leaderboard, Help) */
(function () {
  'use strict';
  const SKE = window.SKE;
  const U = SKE.util;
  const D = SKE.data;
  const $ = U.$;
  const el = U.el;

  class UI {
    constructor(game) {
      this.g = game;
      this.modal = $('#modal');
      this.open = null;
      this.tab = { shop: 'step' };
      this.lastHud = 0;
      this.popCount = 0;
      this.modal.addEventListener('pointerdown', (e) => { if (e.target === this.modal) this.close(); });
      $('#bShop').onclick = () => this.toggle('shop');
      $('#bReb').onclick = () => this.toggle('rebirth');
      $('#bStages').onclick = () => this.toggle('stages');
      $('#bBoard').onclick = () => this.toggle('board');
      $('#bSet').onclick = () => this.toggle('settings');
    }

    // ------------------------------------------------------------ HUD
    hud() {
      const g = this.g;
      const s = g.state;
      $('#vSpeed').textContent = U.fmt(s.speed);
      $('#vWins').textContent = U.fmt(s.wins);
      $('#vReb').textContent = String(s.rebirths);
      const m = g.mults();
      $('#stepInfo').innerHTML = `+${U.fmt(m.perStep)} / step${m.treadmill > 1 ? ` · <b style="color:#ffe27a">treadmill ×${U.fmt(m.treadmill)}</b>` : ''}`;
      const lvl = g.level();
      $('#lvlText').textContent = `Lv ${lvl}`;
      const next = D.REBIRTHS[s.rebirths];
      if (next) {
        const need = D.speedForLevel(next.level);
        const prev = D.speedForLevel(Math.min(lvl, next.level));
        const prog = U.clamp(s.speed / need, 0, 1);
        void prev;
        $('#lvlBar').style.width = (prog * 100).toFixed(1) + '%';
        $('#lvlNext').textContent = lvl >= next.level ? `✔ Sẵn sàng Rebirth! (${U.fmtMult(next.mult)})` : `Rebirth ${s.rebirths + 1} ở Lv ${next.level} → ${U.fmtMult(next.mult)}`;
      } else {
        $('#lvlBar').style.width = '100%';
        $('#lvlNext').textContent = 'MAX REBIRTH';
      }
      $('#bReb').classList.toggle('dot', !!next && lvl >= next.level);
      $('#bShop').classList.toggle('dot', g.canAffordSomething());
    }
    setStage(st) {
      const t = $('#stageTag');
      if (!st) t.innerHTML = '🏠 <b>Spawn</b> · Lobby';
      else t.innerHTML = `Stage <b>${st.index + 1}/13</b> · ${st.name} · Win +${U.fmt(st.wins)}`;
    }
    banner(l1, l2, color) {
      const b = $('#banner');
      $('#bn1').textContent = l1;
      const n2 = $('#bn2');
      n2.textContent = l2;
      n2.style.color = color || '#fff';
      b.classList.remove('show');
      void b.offsetWidth;
      b.classList.add('show');
    }
    toast(msg, kind, life, big) {
      const box = $('#toasts');
      while (box.children.length > 3) box.removeChild(box.firstChild);
      const t = el('div', `toast ${kind || ''} ${big ? 'big' : ''}`, msg);
      t.style.setProperty('--life', (life || 2.4) + 's');
      box.appendChild(t);
      setTimeout(() => t.remove(), ((life || 2.4) + 0.6) * 1000);
    }
    popup(text, x, y, cls) {
      if (this.popCount > 14) return;
      this.popCount++;
      const p = el('div', 'pop ' + (cls || ''), text);
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      $('#popups').appendChild(p);
      p.addEventListener('animationend', () => { p.remove(); this.popCount--; });
    }
    flash() {
      const f = $('#flash');
      f.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
    }
    fade(on) { $('#fade').classList.toggle('on', on); }

    // ------------------------------------------------------------ Panels
    toggle(name) {
      if (this.open === name) this.close();
      else this.show(name);
    }
    show(name) {
      this.open = name;
      this.modal.classList.add('open');
      this.render();
      this.g.onPanel(true);
    }
    close() {
      if (!this.open) return;
      this.open = null;
      this.modal.classList.remove('open');
      this.modal.innerHTML = '';
      this.g.onPanel(false);
    }
    refresh() {
      if (this.open) this.render(true);
    }
    shell(title, h1, h2) {
      const p = el('div', 'panel');
      const head = el('div', 'ph');
      head.style.setProperty('--h1', h1);
      head.style.setProperty('--h2', h2);
      head.appendChild(el('h2', 'stroke', title));
      const x = el('button', 'x', '✕');
      x.onclick = () => this.close();
      head.appendChild(x);
      const body = el('div', 'pb');
      p.appendChild(head);
      p.appendChild(body);
      return { p, body };
    }
    render(keepScroll) {
      const prev = this.modal.querySelector('.pb');
      const sc = prev ? prev.scrollTop : 0;
      this.modal.innerHTML = '';
      let sh;
      switch (this.open) {
        case 'shop': sh = this.renderShop(); break;
        case 'rebirth': sh = this.renderRebirth(); break;
        case 'stages': sh = this.renderStages(); break;
        case 'settings': sh = this.renderSettings(); break;
        case 'board': sh = this.renderBoard(); break;
        case 'help': sh = this.renderHelp(); break;
        default: return;
      }
      this.modal.appendChild(sh.p);
      if (keepScroll) sh.body.scrollTop = sc;
    }

    // ---- Shop
    renderShop() {
      const g = this.g;
      const s = g.state;
      const sh = this.shell('🛒 Shop', '#ff9ec7', '#ff4f93');
      const tabs = el('div', 'tabs');
      [['step', '⚡ Step Power'], ['tread', '🏃 Treadmill'], ['trail', '🌈 Trails'], ['aura', '✨ Auras']].forEach(([id, label]) => {
        const t = el('button', 'tab' + (this.tab.shop === id ? ' on' : ''), label);
        t.onclick = () => { this.tab.shop = id; this.render(); };
        tabs.appendChild(t);
      });
      sh.body.appendChild(tabs);
      sh.body.appendChild(el('div', 'note', `Bạn có <b>${U.fmt(s.wins)} 🏆 Wins</b>. Speed mỗi bước = (Step Power) × Rebirth × Trail × Aura (× Treadmill khi đứng trên treadmill).`));
      const grid = el('div', 'grid');
      const tab = this.tab.shop;
      if (tab === 'step') {
        D.STEPS.forEach((st, i) => {
          if (i === 0) return;
          const owned = s.stepTier >= i;
          const next = s.stepTier + 1 === i;
          const c = el('div', 'card' + (owned ? ' eq' : ''));
          c.appendChild(el('h3', '', `Nút <b>${i + 1}</b> · +${U.fmt(st.step)} / step`));
          c.appendChild(el('div', 'meta', `Giá: ${U.fmt(st.wins)} 🏆`));
          const b = el('button', 'btn' + (owned ? ' gray' : next && s.wins >= st.wins ? ' gold' : ' gray'), owned ? '✔ Đã sở hữu' : next ? 'Mua' : '🔒 Mua nút trước');
          b.disabled = owned || !next;
          b.onclick = () => g.buyStep(i);
          c.appendChild(b);
          grid.appendChild(c);
        });
        sh.body.appendChild(grid);
        sh.body.appendChild(el('div', 'note', 'Mẹo: trong Lobby có hàng phím số 2–8 — bước lên phím tương ứng cũng mua được nâng cấp.'));
      } else if (tab === 'tread') {
        D.TREADMILLS.forEach((t, i) => {
          const owned = s.treadOwned.includes(i);
          const eq = s.treadEq === i;
          const c = el('div', 'card' + (eq ? ' eq' : ''));
          c.appendChild(el('h3', '', t.name));
          const sw = el('div', 'sw');
          sw.style.background = `linear-gradient(90deg, ${t.color}, ${t.glow})`;
          c.appendChild(sw);
          c.appendChild(el('div', 'meta', `Hệ số Speed: <b>${U.fmtMult(t.mult)}</b>` + (owned ? '' : ` · Giá: ${U.fmt(t.cost)} 🏆`)));
          let b;
          if (eq) { b = el('button', 'btn gray', '✔ Đang dùng'); b.disabled = true; }
          else if (owned) { b = el('button', 'btn', 'Dùng'); b.onclick = () => g.equipTread(i); }
          else { b = el('button', 'btn ' + (s.wins >= t.cost ? 'gold' : 'gray'), 'Mua'); b.onclick = () => g.buyTread(i); }
          c.appendChild(b);
          grid.appendChild(c);
        });
        sh.body.appendChild(grid);
        sh.body.appendChild(el('div', 'note', 'Đứng trên treadmill ở lobby hoặc đầu mỗi stage để nhân Speed khi chạy tại chỗ. (Game gốc bán treadmill bằng Robux; ở đây dùng Wins.)'));
      } else {
        const list = tab === 'trail' ? D.TRAILS : D.AURAS;
        const owned = tab === 'trail' ? s.trailsOwned : s.aurasOwned;
        const eqIdx = tab === 'trail' ? s.trailEq : s.auraEq;
        list.forEach((t, i) => {
          const has = owned.includes(i);
          const eq = eqIdx === i;
          const c = el('div', 'card' + (eq ? ' eq' : ''));
          c.appendChild(el('h3', '', t.name));
          const sw = el('div', 'sw');
          sw.style.background = t.color === 'rainbow' ? 'linear-gradient(90deg,#ff4d4d,#ffd23f,#6df0b0,#4dc3ff,#b57bff)' : `linear-gradient(90deg, ${t.color[0]}, ${t.color[1]})`;
          c.appendChild(sw);
          c.appendChild(el('div', 'meta', `Hệ số Speed: <b>${U.fmtMult(t.mult)}</b>` + (has ? '' : ` · Giá: ${U.fmt(t.cost)} 🏆`)));
          let b;
          if (eq) { b = el('button', 'btn gray', 'Tháo ra'); b.onclick = () => g.equipCosmetic(tab, -1); }
          else if (has) { b = el('button', 'btn', 'Trang bị'); b.onclick = () => g.equipCosmetic(tab, i); }
          else { b = el('button', 'btn ' + (s.wins >= t.cost ? 'gold' : 'gray'), 'Mua'); b.onclick = () => g.buyCosmetic(tab, i); }
          c.appendChild(b);
          grid.appendChild(c);
        });
        sh.body.appendChild(grid);
        sh.body.appendChild(el('div', 'note', 'Hệ số của Trail/Aura là ước lượng (game gốc không công bố chính xác).'));
      }
      return sh;
    }

    // ---- Rebirth
    renderRebirth() {
      const g = this.g;
      const s = g.state;
      const sh = this.shell('🔄 Rebirth', '#c9a6ff', '#8a5cff');
      const lvl = g.level();
      const next = D.REBIRTHS[s.rebirths];
      const cur = s.rebirths ? D.REBIRTHS[s.rebirths - 1].mult : 1;
      sh.body.appendChild(el('div', 'row', `<span>Hệ số hiện tại</span><span class="big">${U.fmtMult(cur)}</span>`));
      if (next) {
        const need = D.speedForLevel(next.level);
        sh.body.appendChild(el('div', 'row', `<span>Rebirth tiếp theo (#${next.n})</span><span>Lv <b>${next.level}</b> → <b>${U.fmtMult(next.mult)}</b></span>`));
        const bar = el('div', 'bar');
        bar.appendChild(el('i'));
        bar.firstChild.style.width = (U.clamp(s.speed / need, 0, 1) * 100).toFixed(1) + '%';
        sh.body.appendChild(bar);
        sh.body.appendChild(el('div', 'note', `Level hiện tại: <b>${lvl}</b> · Speed ${U.fmt(s.speed)} / ${U.fmt(need)}`));
        const b = el('button', 'btn pink', lvl >= next.level ? 'REBIRTH!' : `Cần Lv ${next.level}`);
        b.style.width = '100%';
        b.style.fontSize = '22px';
        b.disabled = lvl < next.level;
        b.onclick = () => g.rebirth();
        sh.body.appendChild(b);
      } else {
        sh.body.appendChild(el('div', 'note', '🎉 Bạn đã đạt Rebirth tối đa!'));
      }
      sh.body.appendChild(el('div', 'note', 'Rebirth đặt lại <b>Speed</b> và Level về 0, nhưng giữ Wins, Trails, Auras, Treadmill và Step Power.'));
      const t = el('table', 'rb');
      t.innerHTML = '<tr><th>#</th><th>Level cần</th><th>Hệ số Speed</th></tr>';
      D.REBIRTHS.forEach((r) => {
        const tr = el('tr', r.n <= s.rebirths ? 'done' : r.n === s.rebirths + 1 ? 'cur' : '');
        tr.innerHTML = `<td>${r.n}</td><td>${r.level}</td><td>${U.fmtMult(r.mult)}</td>`;
        t.appendChild(tr);
      });
      sh.body.appendChild(t);
      return sh;
    }

    // ---- Stages
    renderStages() {
      const g = this.g;
      const s = g.state;
      const sh = this.shell('🏁 Stages', '#7fe0ff', '#2f9bff');
      sh.body.appendChild(el('div', 'note', 'Chạm bệ vàng <b>WIN</b> cuối mỗi stage để nhận Wins rồi bị đưa về Spawn. Dùng bảng này để quay lại checkpoint đã mở khoá.'));
      const grid = el('div', 'grid');
      const sp = el('div', 'card stage-card');
      sp.innerHTML = '<div class="top" style="background:linear-gradient(90deg,#ff9ec7,#b57bff)"><span>🏠 Spawn</span></div>';
      const sbd = el('div', 'bd', '<div class="meta">Lobby: treadmill, Shop, Rebirth</div>');
      const sb = el('button', 'btn pink', 'Teleport');
      sb.onclick = () => g.teleportSpawn();
      sbd.appendChild(sb);
      sp.appendChild(sbd);
      grid.appendChild(sp);
      D.STAGES.forEach((st, i) => {
        const unlocked = i <= s.maxStage;
        const c = el('div', 'card stage-card' + (unlocked ? '' : ' lock'));
        const top = el('div', 'top', `<span>#${i + 1}</span><span>+${U.fmt(st.wins)} 🏆</span>`);
        top.style.background = `linear-gradient(90deg, ${st.caps[0]}, ${st.accent})`;
        c.appendChild(top);
        const bd = el('div', 'bd');
        bd.appendChild(el('h3', '', st.name));
        bd.appendChild(el('div', 'meta', `Speed khuyến nghị: <b>${U.fmt(st.rec)}</b>`));
        const b = el('button', 'btn ' + (unlocked ? '' : 'gray'), unlocked ? 'Teleport' : '🔒 Chưa mở');
        b.disabled = !unlocked;
        b.onclick = () => g.teleportStage(i);
        bd.appendChild(b);
        c.appendChild(bd);
        grid.appendChild(c);
      });
      sh.body.appendChild(grid);
      return sh;
    }

    // ---- Settings
    renderSettings() {
      const g = this.g;
      const st = g.state.settings;
      const sh = this.shell('⚙️ Cài đặt', '#b9c4d6', '#7a8aa6');
      sh.body.appendChild(el('div', 'note', '<b>Âm thanh bước chân (ASMR)</b>'));
      const rd = el('div', 'radio');
      D.PACKS.forEach((p) => {
        const c = el('button', 'chip' + (st.pack === p.id ? ' on' : ''), p.name);
        c.onclick = () => { g.setPack(p.id); this.render(true); };
        rd.appendChild(c);
      });
      sh.body.appendChild(rd);
      const slider = (label, min, max, step, val, fn) => {
        const wrap = el('div', '', `<div class="note"><b>${label}</b></div>`);
        const r = el('input');
        r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = val;
        r.oninput = () => fn(parseFloat(r.value));
        wrap.appendChild(r);
        return wrap;
      };
      sh.body.appendChild(slider('Âm lượng', 0, 1, 0.05, st.vol, (v) => g.setVolume(v)));
      sh.body.appendChild(slider('Độ nhạy camera', 0.3, 2.5, 0.1, st.sens, (v) => g.setSens(v)));
      const rd2 = el('div', 'radio');
      [['Bóng đổ: Bật', true], ['Bóng đổ: Tắt (nhẹ máy)', false]].forEach(([label, v]) => {
        const c = el('button', 'chip' + (st.shadows === v ? ' on' : ''), label);
        c.onclick = () => { g.setShadows(v); this.render(true); };
        rd2.appendChild(c);
      });
      sh.body.appendChild(el('div', 'note', '<b>Đồ hoạ</b>'));
      sh.body.appendChild(rd2);
      sh.body.appendChild(el('div', 'note', '<b>Điều khiển</b>'));
      const k = el('div', 'keys');
      k.innerHTML = '<kbd>W A S D</kbd><span>Di chuyển (hoặc phím mũi tên)</span><kbd>Space</kbd><span>Nhảy</span><kbd>Kéo chuột</kbd><span>Xoay camera</span><kbd>I / O</kbd><span>Zoom vào / ra (hoặc lăn chuột)</span><kbd>Tab</kbd><span>Bảng xếp hạng</span><kbd>B R T</kbd><span>Shop · Rebirth · Stages</span><kbd>Esc</kbd><span>Cài đặt / đóng bảng</span>';
      sh.body.appendChild(k);
      const row = el('div', 'row');
      const help = el('button', 'btn', '❓ Hướng dẫn');
      help.onclick = () => this.show('help');
      const reset = el('button', 'btn red', '🗑 Xoá tiến trình');
      let armed = false;
      reset.onclick = () => {
        // xác nhận ngay trong trang (confirm() bị chặn trong khung artifact)
        if (!armed) {
          armed = true;
          reset.textContent = 'Bấm lần nữa để xoá hết';
          setTimeout(() => { armed = false; reset.textContent = '🗑 Xoá tiến trình'; }, 4000);
          return;
        }
        g.resetSave();
      };
      row.appendChild(help);
      row.appendChild(reset);
      sh.body.appendChild(row);
      return sh;
    }

    // ---- Leaderboard
    renderBoard() {
      const g = this.g;
      const sh = this.shell('📋 Bảng xếp hạng server', '#ffe27a', '#f59e0b');
      const rows = g.leaderboard();
      const hd = el('div', 'lbrow hd', '<span>#</span><span>Người chơi</span><span>Speed</span><span>Wins</span>');
      sh.body.appendChild(hd);
      rows.forEach((r, i) => {
        const d = el('div', 'lbrow' + (r.me ? ' me' : ''), `<span>${i + 1}</span><span>${r.name}${r.me ? ' (bạn)' : ' · bot'}</span><span>${U.fmt(r.speed)}</span><span>${U.fmt(r.wins)}</span>`);
        sh.body.appendChild(d);
      });
      sh.body.appendChild(el('div', 'note', 'Bản này chơi một mình — các tên khác là bot mô phỏng để giống không khí server của game gốc.'));
      return sh;
    }

    // ---- Help
    renderHelp() {
      const sh = this.shell('❓ Cách chơi', '#6df0b0', '#1fb877');
      sh.body.innerHTML = `
        <div class="note" style="font-size:16px;opacity:1">
        <p><b>Mục tiêu:</b> chạy trên bàn phím kẹo khổng lồ — <b>mỗi bước chân = +Speed</b>. Speed càng cao bạn chạy càng nhanh, nhảy càng xa, và vượt được các stage khó hơn.</p>
        <p>🏃 Đứng trên <b>treadmill</b> (lobby / đầu mỗi stage) để cày Speed khi chạy tại chỗ.<br>
        🏁 Đi hết stage, chạm <b>bệ vàng WIN</b> để nhận Wins (+1 → +25.000) rồi bị đưa về Spawn.<br>
        🛒 Dùng Wins mua <b>Step Power</b>, <b>Treadmill</b>, <b>Trails</b>, <b>Auras</b> để nhân Speed mỗi bước.<br>
        🔄 Đạt Level yêu cầu để <b>Rebirth</b>: reset Speed nhưng nhận hệ số nhân vĩnh viễn.<br>
        ⚠️ Cẩn thận: khe nhảy dài dần, cầu <b>biến mất</b>, sàn di động, thanh quay, <b>Brainrot</b> đuổi, và <b>tia laser</b> (nấp sau khối lớn!). Rơi xuống biển chocolate sẽ về checkpoint gần nhất.<br>
        💡 Speed quá cao thì rất khó dừng — hãy <b>bấm nhẹ phím di chuyển</b> khi hạ cánh trên phím nhỏ.</p>
        <p style="font-size:13px;opacity:.75">Bản fan-made không chính thức, không liên kết với SecretVerse Studio hay Roblox.</p>
        </div>`;
      const b = el('button', 'btn pink', 'Bắt đầu chơi!');
      b.style.width = '100%';
      b.style.fontSize = '22px';
      b.onclick = () => this.close();
      sh.body.appendChild(b);
      return sh;
    }
  }

  SKE.UI = UI;
})();

</script>
<script>
/* Vòng lặp game, kinh tế (Speed / Wins / Rebirth), trigger, hiệu ứng */
(function () {
  'use strict';
  const SKE = window.SKE;
  const THREE = window.THREE;
  const U = SKE.util;
  const D = SKE.data;
  const $ = U.$;
  const A = SKE.audio;

  const SAVE_KEY = 'ske_save_v1';

  function defaults() {
    return {
      speed: 0, wins: 0, rebirths: 0, stepTier: 0,
      treadOwned: [0], treadEq: 0,
      trailsOwned: [], trailEq: -1, aurasOwned: [], auraEq: -1,
      maxStage: 0, steps: 0, totalWins: 0, deaths: 0, helped: false,
      settings: { pack: 'keyboard', vol: 0.7, sens: 1, shadows: true },
    };
  }

  const srgb = (hex) => [((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255];
  const hexNum = (h) => parseInt(h.replace('#', ''), 16);
  function hsl2rgb(h, s, l) {
    const c = new THREE.Color();
    c.setHSL(h, s, l, THREE.SRGBColorSpace);
    const o = {};
    c.getRGB(o, THREE.SRGBColorSpace);
    return [o.r, o.g, o.b];
  }

  function boot() {
    const canvas = $('#c');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      $('#loading').innerHTML = '<div><h1 class="stroke">Không khởi tạo được WebGL</h1><p>Hãy bật tăng tốc phần cứng trong trình duyệt rồi tải lại trang.</p></div>';
      return;
    }
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouch) document.body.classList.add('touch');
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.3, 1400);
    scene.fog = new THREE.Fog('#ffe1f0', 90, 420);

    // ---- ánh sáng
    const hemi = new THREE.HemisphereLight('#ffffff', '#e0a8d0', 1.7);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight('#fff4e0', 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
    const sc = sun.shadow.camera;
    sc.left = -58; sc.right = 58; sc.top = 58; sc.bottom = -58; sc.near = 10; sc.far = 260;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.05;
    scene.add(sun);
    scene.add(sun.target);

    // ---- bầu trời
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: new THREE.Color('#6cc4ff') }, bottom: { value: new THREE.Color('#ffe1f0') } },
      vertexShader: 'varying vec3 vP;\nvoid main(){\n vP = normalize(position);\n gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);\n}',
      fragmentShader: 'uniform vec3 top;\nuniform vec3 bottom;\nvarying vec3 vP;\nvoid main(){\n float h = smoothstep(-0.05, 0.75, vP.y);\n gl_FragColor = vec4(mix(bottom, top, h), 1.0);\n#include <colorspace_fragment>\n}',
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 24, 16), skyMat);
    sky.frustumCulled = false;
    sky.renderOrder = -10;
    scene.add(sky);

    // ---- thế giới / người chơi
    const world = new SKE.World(scene);
    const player = new SKE.Player(world);
    scene.add(player.avatar.group);
    const input = new SKE.Input(canvas);
    const cam = new SKE.CameraRig(camera);
    const glowFx = new SKE.Particles(scene, 1400, true);
    const solidFx = new SKE.Particles(scene, 900, false);

    const state = Object.assign(defaults(), U.load(SAVE_KEY, {}));
    state.settings = Object.assign(defaults().settings, state.settings || {});
    ['treadOwned', 'trailsOwned', 'aurasOwned'].forEach((k) => { if (!Array.isArray(state[k])) state[k] = defaults()[k]; });
    if (!state.treadOwned.includes(0)) state.treadOwned.push(0);

    // ------------------------------------------------------------ trạng thái runtime
    const rt = {
      time: 0, stepTimer: 0.1, foot: 0, checkpoint: world.lobbyCk, curStage: -2, dying: false, winLock: false,
      lastPad: null, lastLvl: 1, hudAcc: 0, saveAcc: 0, panel: false, trailAcc: 0, auraAcc: 0, themeT: 0, splashed: false,
      sparkAcc: 0, lastLevelSound: 0, airTime: 0,
    };
    const themeNow = { top: new THREE.Color('#6cc4ff'), bottom: new THREE.Color('#ffe1f0'), fog: new THREE.Color('#ffe1f0'), sea: new THREE.Color('#7a4a35'), light: 1 };
    const projV = new THREE.Vector3();

    // ------------------------------------------------------------ game API
    const game = {
      state, world, player, input, cam, rt, renderer, scene, camera,
      mults() {
        const reb = state.rebirths ? D.REBIRTHS[state.rebirths - 1].mult : 1;
        const trail = state.trailEq >= 0 ? D.TRAILS[state.trailEq].mult : 1;
        const aura = state.auraEq >= 0 ? D.AURAS[state.auraEq].mult : 1;
        const tread = D.TREADMILLS[state.treadEq].mult;
        const step = D.STEPS[state.stepTier].step;
        return { reb, trail, aura, tread, step, perStep: step * reb * trail * aura, treadmill: tread };
      },
      level() { return D.levelFromSpeed(state.speed); },
      canAffordSomething() {
        const w = state.wins;
        const ns = D.STEPS[state.stepTier + 1];
        if (ns && w >= ns.wins) return true;
        if (D.TREADMILLS.some((t, i) => !state.treadOwned.includes(i) && w >= t.cost)) return true;
        if (D.TRAILS.some((t, i) => !state.trailsOwned.includes(i) && w >= t.cost)) return true;
        if (D.AURAS.some((t, i) => !state.aurasOwned.includes(i) && w >= t.cost)) return true;
        return false;
      },
      onPanel(open) {
        rt.panel = open;
        if (open) { input.keys.clear(); input.stick.x = input.stick.y = 0; }
        ui.hud();
      },
      save() { U.save(SAVE_KEY, state); },
      changed() { ui.hud(); ui.refresh(); world.refreshPads(state); game.save(); },

      buyStep(i) {
        const st = D.STEPS[i];
        if (i !== state.stepTier + 1) return false;
        if (state.wins < st.wins) { A.deny(); ui.toast('Chưa đủ Wins!', 'bad', 1.6); return false; }
        state.wins -= st.wins;
        state.stepTier = i;
        A.buy();
        ui.toast(`Step Power +${U.fmt(st.step)} mỗi bước!`, 'good');
        burst(player.pos.x, player.pos.y + 1.2, player.pos.z, 30, [255, 226, 122]);
        game.changed();
        return true;
      },
      buyTread(i) {
        const t = D.TREADMILLS[i];
        if (state.treadOwned.includes(i)) return;
        if (state.wins < t.cost) { A.deny(); ui.toast('Chưa đủ Wins!', 'bad', 1.6); return; }
        state.wins -= t.cost;
        state.treadOwned.push(i);
        game.equipTread(i, true);
        A.buy();
        ui.toast(`${t.name} ${U.fmtMult(t.mult)}!`, 'good');
      },
      equipTread(i, silent) {
        state.treadEq = i;
        world.setTreadmillTier(i);
        if (!silent) A.click();
        game.changed();
      },
      buyCosmetic(kind, i) {
        const list = kind === 'trail' ? D.TRAILS : D.AURAS;
        const owned = kind === 'trail' ? state.trailsOwned : state.aurasOwned;
        const t = list[i];
        if (owned.includes(i)) return;
        if (state.wins < t.cost) { A.deny(); ui.toast('Chưa đủ Wins!', 'bad', 1.6); return; }
        state.wins -= t.cost;
        owned.push(i);
        A.buy();
        ui.toast(`${t.name} ${U.fmtMult(t.mult)}!`, 'good');
        game.equipCosmetic(kind, i, true);
      },
      equipCosmetic(kind, i, silent) {
        if (kind === 'trail') state.trailEq = i;
        else state.auraEq = i;
        if (!silent) A.click();
        game.changed();
      },
      rebirth() {
        const next = D.REBIRTHS[state.rebirths];
        if (!next || game.level() < next.level) { A.deny(); return; }
        state.rebirths++;
        state.speed = 0;
        rt.lastLvl = 1;
        A.rebirth();
        ui.close();
        ui.banner('REBIRTH ' + state.rebirths, U.fmtMult(next.mult), '#e5d1ff');
        ui.toast(`Rebirth thành công! Mỗi bước nhân ${U.fmtMult(next.mult)}`, 'purple', 3.2);
        teleportCk(world.lobbyCk, true);
        setTimeout(() => confetti(player.pos.x, player.pos.y + 1, player.pos.z, 160), 400);
        game.changed();
      },
      teleportStage(i) {
        if (i > state.maxStage) return;
        ui.close();
        teleportCk(world.plazaCk[i], true);
      },
      teleportSpawn() {
        ui.close();
        teleportCk(world.lobbyCk, true);
      },
      setPack(id) { state.settings.pack = id; A.setPack(id); A.resume(); A.step(1); game.save(); },
      setVolume(v) { state.settings.vol = v; A.setVolume(v); game.save(); },
      setSens(v) { state.settings.sens = v; input.sens = v; game.save(); },
      setShadows(v) {
        state.settings.shadows = v;
        renderer.shadowMap.enabled = v;
        sun.castShadow = v;
        scene.traverse((o) => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; }); } });
        game.save();
      },
      resetSave() {
        try { window.localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
        window.location.reload();
      },
      leaderboard() {
        const rows = D.BOTS.map((name, i) => {
          const base = 2000 * Math.pow(6.5, 6 - i) * (1 + 0.04 * Math.sin(rt.time * 0.3 + i * 2));
          return { name, speed: base, wins: Math.floor(base / 2500) + i * 40 };
        });
        rows.push({ name: 'Bạn', speed: state.speed, wins: state.totalWins, me: true });
        rows.sort((a, b) => b.speed - a.speed);
        return rows;
      },
    };

    const ui = new SKE.UI(game);
    game.ui = ui;

    // ------------------------------------------------------------ hiệu ứng
    function burst(x, y, z, n, rgb) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 2 + Math.random() * 6;
        glowFx.emit(x, y, z, Math.cos(a) * s, 2 + Math.random() * 6, Math.sin(a) * s, 0.7 + Math.random() * 0.5, 0.5 + Math.random() * 0.4, rgb[0] / 255, rgb[1] / 255, rgb[2] / 255, 8);
      }
    }
    function confetti(x, y, z, n) {
      const cols = ['#ff6fa5', '#ffd23f', '#6df0b0', '#6cc4ff', '#b57bff', '#ffffff'];
      for (let i = 0; i < n; i++) {
        const c = srgb(hexNum(cols[(Math.random() * cols.length) | 0]));
        const a = Math.random() * Math.PI * 2;
        const s = 3 + Math.random() * 11;
        solidFx.emit(x, y, z, Math.cos(a) * s, 6 + Math.random() * 14, Math.sin(a) * s, 1.4 + Math.random() * 1.2, 0.35 + Math.random() * 0.35, c[0], c[1], c[2], 22);
      }
    }
    function puff(x, y, z, rgb, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        solidFx.emit(x + Math.cos(a) * 0.3, y + 0.1, z + Math.sin(a) * 0.3, Math.cos(a) * 2.2, 0.8 + Math.random() * 1.2, Math.sin(a) * 2.2, 0.35, 0.3 + Math.random() * 0.25, rgb[0], rgb[1], rgb[2], 3);
      }
    }
    function splash(x, z) {
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 2 + Math.random() * 6;
        solidFx.emit(x, world.seaY + 0.3, z, Math.cos(a) * s, 6 + Math.random() * 10, Math.sin(a) * s, 1.1, 0.5 + Math.random() * 0.5, 0.45, 0.25, 0.12, 24);
      }
    }
    function trailColor(def, t) {
      if (def.color === 'rainbow') return hsl2rgb((t * 0.6 + Math.random() * 0.1) % 1, 1, 0.6);
      const c = srgb(hexNum(def.color[Math.random() < 0.5 ? 0 : 1]));
      return c;
    }

    // ------------------------------------------------------------ teleport / respawn
    function placeAt(ck) {
      player.place(ck.x, ck.y + 0.05, ck.z);
      player.avatar.yaw = ck.yaw + Math.PI;
      cam.snap(player.pos, ck.yaw);
      rt.stepTimer = 0.1;
      rt.splashed = false;
    }
    function teleportCk(ck, fade) {
      rt.checkpoint = ck.stage === -1 || ck.plaza ? ck : rt.checkpoint;
      rt.winLock = true;
      if (fade) {
        ui.fade(true);
        setTimeout(() => {
          placeAt(ck);
          rt.checkpoint = ck;
          player.invuln = 1.0;
          setTimeout(() => { ui.fade(false); rt.winLock = false; }, 120);
        }, 380);
      } else {
        placeAt(ck);
        rt.checkpoint = ck;
        rt.winLock = false;
      }
    }
    function kill(reason) {
      if (rt.dying || player.invuln > 0) return;
      rt.dying = true;
      state.deaths++;
      A.die();
      ui.flash();
      cam.shake = 0.6;
      burst(player.pos.x, player.pos.y + 1, player.pos.z, 36, [255, 111, 165]);
      const msg = { laser: 'Bị tia laser bắn trúng!', brainrot: 'Brainrot bắt được bạn!', spinner: 'Trúng thanh quay!', fall: 'Rơi xuống biển chocolate!' }[reason] || 'Oops!';
      ui.toast(msg, 'bad', 1.6);
      player.avatar.group.visible = false;
      setTimeout(() => {
        placeAt(rt.checkpoint);
        player.invuln = 1.6;
        player.avatar.group.visible = true;
        rt.dying = false;
      }, 520);
    }

    // ------------------------------------------------------------ trigger
    function onWin(stageIdx) {
      if (rt.winLock) return;
      rt.winLock = true;
      const st = D.STAGES[stageIdx];
      state.wins += st.wins;
      state.totalWins += st.wins;
      state.maxStage = Math.max(state.maxStage, Math.min(D.STAGES.length - 1, stageIdx + 1));
      A.win();
      confetti(player.pos.x, player.pos.y + 1, player.pos.z, 120);
      ui.toast(`+${U.fmt(st.wins)} WINS!`, '', 2.6, true);
      if (stageIdx < D.STAGES.length - 1) ui.toast(`Đã mở checkpoint Stage ${stageIdx + 2} — bấm T để teleport`, 'info', 3);
      game.changed();
      setTimeout(() => {
        ui.fade(true);
        setTimeout(() => {
          placeAt(world.lobbyCk);
          rt.checkpoint = world.lobbyCk;
          player.invuln = 1;
          setTimeout(() => { ui.fade(false); rt.winLock = false; }, 120);
        }, 380);
      }, 900);
    }
    function onPad(pad) {
      if (pad.type === 'shop') ui.show('shop');
      else if (pad.type === 'rebirth') ui.show('rebirth');
      else if (pad.type === 'step') {
        if (state.stepTier >= pad.tier) ui.toast('Bạn đã sở hữu nút này rồi ✔', 'info', 1.4);
        else if (!game.buyStep(pad.tier)) { /* buyStep tự báo lỗi */ if (pad.tier !== state.stepTier + 1) ui.toast('Hãy mua các nút số trước đó trước!', 'bad', 1.6); }
      }
    }

    // ------------------------------------------------------------ bước chân
    function doStep(onTread) {
      const m = game.mults();
      const gain = m.perStep * (onTread ? m.tread : 1);
      state.speed += gain;
      state.steps++;
      rt.foot ^= 1;
      A.step((rt.foot ? 1.0 : 0.93) * (0.94 + Math.random() * 0.12));
      const g = player.ground;
      if (g && g.pr) world.press(g);
      const gcol = g && g.kind === 'key' ? [1, 1, 1] : [1, 0.9, 0.95];
      puff(player.pos.x, player.pos.y, player.pos.z, gcol, 3);
      projV.set(player.pos.x, player.pos.y + 2.4, player.pos.z).project(camera);
      if (projV.z < 1) {
        const x = (projV.x * 0.5 + 0.5) * window.innerWidth + (rt.foot ? 18 : -18);
        const y = (-projV.y * 0.5 + 0.5) * window.innerHeight;
        ui.popup(`+${U.fmt(gain)}`, x, y, onTread && m.tread > 1 ? 'gold' : '');
      }
      const lvl = game.level();
      if (lvl > rt.lastLvl) {
        if (rt.time - rt.lastLevelSound > 1.2) {
          A.levelUp();
          ui.toast(`⬆ Level ${lvl}`, 'info', 1.4);
          rt.lastLevelSound = rt.time;
        }
        rt.lastLvl = lvl;
      }
      rt.hudDirty = true;
    }

    // ------------------------------------------------------------ hiệu ứng trail/aura mỗi frame
    function updateCosmetics(dt, horiz) {
      const p = player.pos;
      if (state.trailEq >= 0 && player.grounded && horiz > 2) {
        const def = D.TRAILS[state.trailEq];
        rt.trailAcc += dt * 70;
        while (rt.trailAcc > 1) {
          rt.trailAcc -= 1;
          const c = trailColor(def, rt.time);
          glowFx.emit(p.x + (Math.random() - 0.5) * 0.7, p.y + 0.15, p.z + (Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.8, 0.4 + Math.random() * 0.6, (Math.random() - 0.5) * 0.8, 0.7, 0.55 + Math.random() * 0.35, c[0], c[1], c[2], 0);
        }
      }
      if (state.auraEq >= 0) {
        const def = D.AURAS[state.auraEq];
        rt.auraAcc += dt * 48;
        while (rt.auraAcc > 1) {
          rt.auraAcc -= 1;
          const a = Math.random() * Math.PI * 2;
          const r = 0.8 + Math.random() * 0.4;
          const c = trailColor(def, rt.time + 0.5);
          let vy = 1.4 + Math.random() * 1.2;
          let tang = 0;
          if (def.id === 'fire') vy = 3 + Math.random() * 2;
          if (def.id === 'wind') { vy = 0.4; tang = 5; }
          if (def.id === 'water') vy = 0.8 + Math.random();
          const sys = def.id === 'void' ? solidFx : glowFx;
          sys.emit(p.x + Math.cos(a) * r, p.y + 0.2 + Math.random() * 1.8, p.z + Math.sin(a) * r, -Math.sin(a) * tang, vy, Math.cos(a) * tang, def.id === 'wind' ? 0.5 : 0.9, 0.45 + Math.random() * 0.45, c[0], c[1], c[2], 0);
        }
      }
    }

    // ------------------------------------------------------------ theme theo stage
    function updateTheme(dt, stageIdx) {
      const st = stageIdx >= 0 ? D.STAGES[stageIdx] : null;
      const top = st ? st.sky[0] : '#6cc4ff';
      const bot = st ? st.sky[1] : '#ffe1f0';
      const fog = st ? st.fog : '#ffe1f0';
      const light = st && st.dark ? 0.55 : 1;
      const k = 1 - Math.exp(-1.6 * dt);
      themeNow.top.lerp(new THREE.Color(top), k);
      themeNow.bottom.lerp(new THREE.Color(bot), k);
      themeNow.fog.lerp(new THREE.Color(fog), k);
      themeNow.light += (light - themeNow.light) * k;
      const seaT = new THREE.Color(st ? st.deck : '#5b3426').lerp(new THREE.Color(fog), 0.15);
      themeNow.sea.lerp(seaT, k);
      skyMat.uniforms.top.value.copy(themeNow.top);
      skyMat.uniforms.bottom.value.copy(themeNow.fog);
      scene.fog.color.copy(themeNow.fog);
      hemi.intensity = 1.7 * themeNow.light;
      sun.intensity = 2.6 * (0.45 + 0.55 * themeNow.light);
    }

    // ------------------------------------------------------------ phím tắt
    input.onKey((k) => {
      A.resume();
      if (k === 'Escape') { if (ui.open) ui.close(); else ui.show('settings'); return; }
      if (k === 'b') ui.toggle('shop');
      else if (k === 'r') ui.toggle('rebirth');
      else if (k === 't') ui.toggle('stages');
      else if (k === 'Tab') ui.toggle('board');
      else if (k === 'h') ui.toggle('help');
      else if (k === 'e' && ui.open === 'rebirth') game.rebirth();
    });
    window.addEventListener('pointerdown', () => A.resume(), { once: false });

    // ------------------------------------------------------------ touch controls
    (function touchSetup() {
      const stick = $('#stick');
      const knob = $('#knob');
      let id = null;
      const move = (e) => {
        const r = stick.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        let dx = (e.clientX - cx) / (r.width / 2);
        let dy = (e.clientY - cy) / (r.height / 2);
        const l = Math.hypot(dx, dy);
        if (l > 1) { dx /= l; dy /= l; }
        input.stick.x = dx;
        input.stick.y = -dy;
        knob.style.transform = `translate(${dx * 38}px, ${dy * 38}px)`;
      };
      stick.addEventListener('pointerdown', (e) => { id = e.pointerId; stick.setPointerCapture(id); move(e); A.resume(); });
      stick.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
      const end = (e) => { if (e.pointerId === id) { id = null; input.stick.x = input.stick.y = 0; knob.style.transform = ''; } };
      stick.addEventListener('pointerup', end);
      stick.addEventListener('pointercancel', end);
      const jb = $('#jumpBtn');
      jb.addEventListener('pointerdown', (e) => { e.preventDefault(); input.jumpQueued = true; A.resume(); });
    })();

    // ------------------------------------------------------------ resize
    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('beforeunload', () => game.save());
    document.addEventListener('visibilitychange', () => { if (document.hidden) game.save(); });

    // ------------------------------------------------------------ khởi tạo trạng thái
    A.setPack(state.settings.pack);
    A.setVolume(state.settings.vol);
    input.sens = state.settings.sens;
    if (!state.settings.shadows) game.setShadows(false);
    world.setTreadmillTier(state.treadEq);
    world.refreshPads(state);
    placeAt(world.lobbyCk);
    rt.lastLvl = game.level();
    ui.setStage(null);
    ui.hud();

    // ------------------------------------------------------------ vòng lặp
    const ctx = { player, audio: A, kill, seaColor: themeNow.sea };
    let last = performance.now();
    function update(dt) {
      rt.time += dt;
      const t = rt.time;

      // camera orbit
      cam.yaw += input.camYawDelta;
      cam.pitch = U.clamp(cam.pitch + input.camPitchDelta, -0.05, 1.3);
      input.camYawDelta = 0;
      input.camPitchDelta = 0;
      if (input.zoom) { cam.dist = U.clamp(cam.dist * (1 + 0.1 * input.zoom), 5, 44); input.zoom = 0; }
      if (!rt.panel) {
        if (input.keys.has('i')) cam.dist = U.clamp(cam.dist - 14 * dt, 5, 44);
        if (input.keys.has('o')) cam.dist = U.clamp(cam.dist + 14 * dt, 5, 44);
      }

      world.update(dt, t, ctx);

      const moveSpeed = D.moveSpeed(state.speed);
      let ax = 0;
      let ay = 0;
      let jump = false;
      if (rt.auto) {
        // autopilot (chỉ dùng cho kiểm thử)
        const r = rt.auto(dt, player, cam);
        if (r && !rt.dying && !rt.winLock) {
          const sy = Math.sin(cam.yaw);
          const cy = Math.cos(cam.yaw);
          ay = r.dx * -sy + r.dz * -cy;
          ax = r.dx * cy + r.dz * -sy;
          jump = !!r.jump;
        }
      } else if (!rt.panel && !rt.dying && !rt.winLock) {
        const a = input.axes();
        ax = a.ax; ay = a.ay;
        jump = input.takeJump();
      } else input.jumpQueued = false;
      if (rt.dying) { player.vel.set(0, 0, 0); } else {
        player.update(dt, { ax, ay, jump, camYaw: cam.yaw }, moveSpeed, A);
      }
      const g = player.ground;
      const horiz = Math.hypot(player.vel.x, player.vel.z);

      // trigger theo mặt đứng
      if (g && !rt.dying) {
        if (g.kind === 'win') onWin(g.stage);
        if (g.kind === 'pad') { if (rt.lastPad !== g) { rt.lastPad = g; onPad(g.pad); } } else rt.lastPad = null;
        if (g.owner && g.owner.touch) g.owner.touch();
        if (g.ck && g.ck !== rt.checkpoint && !rt.winLock) {
          rt.checkpoint = g.ck;
          if (!g.ck.lobby) { A.checkpoint(); ui.toast('✔ Checkpoint đã lưu', 'good', 1.3); }
          if (g.ck.plaza && g.ck.stage >= 0 && g.ck.stage > state.maxStage) { state.maxStage = g.ck.stage; game.changed(); }
        }
        if (g.stage !== undefined && g.stage !== rt.curStage) {
          rt.curStage = g.stage;
          const st = g.stage >= 0 ? D.STAGES[g.stage] : null;
          ui.setStage(st);
          if (st) ui.banner(`STAGE ${g.stage + 1}`, st.name, st.accent);
          else ui.banner('SPAWN', 'Lobby', '#ffd6f0');
        }
      } else if (!g) rt.lastPad = null;

      // rơi xuống biển
      if (!rt.dying) {
        if (player.pos.y < world.seaY && !rt.splashed) { rt.splashed = true; splash(player.pos.x, player.pos.z); A.splash(); }
        if (player.pos.y < world.killY) kill('fall');
        if (player.pos.y > world.seaY + 2) rt.splashed = false;
      }

      // bước chân
      const onTread = !!(g && g.kind === 'treadmill');
      const walking = player.grounded && horiz > 1.5;
      const running = !rt.dying && (walking || (onTread && player.grounded));
      const interval = U.clamp(0.42 - 0.0045 * (moveSpeed - 9), 0.2, 0.42);
      if (running) {
        rt.stepTimer -= dt;
        if (rt.stepTimer <= 0) { doStep(onTread); rt.stepTimer += interval; if (rt.stepTimer < 0) rt.stepTimer = interval * 0.5; }
      } else rt.stepTimer = Math.min(rt.stepTimer, 0.08);

      // avatar
      const av = player.avatar;
      if (horiz > 1) av.yaw += U.angleDiff(av.yaw, Math.atan2(player.vel.x, player.vel.z)) * Math.min(1, dt * 16);
      else if (onTread) av.yaw += U.angleDiff(av.yaw, cam.yaw + Math.PI + Math.PI) * Math.min(1, dt * 8);
      const runAmt = running ? 1 : 0;
      av.update(dt, runAmt, 1 / interval / 2, !player.grounded, player.vel.y);
      if (player.invuln > 0 && !rt.dying) av.group.visible = Math.floor(t * 12) % 2 === 0 || player.invuln < 0.1;
      else if (!rt.dying) av.group.visible = true;

      updateCosmetics(dt, horiz);

      // camera + ánh sáng + hạt
      cam.update(dt, player.pos, moveSpeed, horiz);
      sun.position.set(player.pos.x + 38, player.pos.y + 70, player.pos.z + 26);
      sun.target.position.copy(player.pos);
      sun.target.updateMatrixWorld();
      sky.position.copy(camera.position);
      updateTheme(dt, rt.curStage >= 0 ? rt.curStage : -1);
      glowFx.update(dt, window.innerHeight * renderer.getPixelRatio(), camera.fov);
      solidFx.update(dt, window.innerHeight * renderer.getPixelRatio(), camera.fov);

      // HUD / lưu
      rt.hudAcc += dt;
      if (rt.hudDirty || rt.hudAcc > 0.5) { rt.hudDirty = false; rt.hudAcc = 0; ui.hud(); }
      rt.saveAcc += dt;
      if (rt.saveAcc > 5) { rt.saveAcc = 0; game.save(); }
    }
    game.update = update;
    function frame(now) {
      const dt = Math.min(0.05, Math.max(0.0001, (now - last) / 1000));
      last = now;
      if (!rt.manual) {
        update(dt);
        renderer.render(scene, camera);
      }
      requestAnimationFrame(frame);
    }

    // hướng dẫn lần đầu
    if (!state.helped) { state.helped = true; setTimeout(() => ui.show('help'), 700); }
    window.SKE_GAME = game;
    requestAnimationFrame((n) => { last = n; frame(n); });
    setTimeout(() => $('#loading').classList.add('done'), 300);
  }

  // chờ font (tối đa 1.2s) để canvas texture dùng đúng font
  const fontReady = document.fonts && document.fonts.load
    ? Promise.race([document.fonts.load('700 24px Fredoka'), new Promise((r) => setTimeout(r, 1200))])
    : Promise.resolve();
  fontReady.catch(() => {}).then(boot);
})();

</script>
